<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勇者の世界ガチャ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Three.js for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&family=Shippori+Mincho:wght@700;800&display=swap');

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: radial-gradient(circle at 50% 20%, #201335 0%, #0c0817 100%);
            min-height: 100vh;
            color: #ffffff;
            user-select: none;
        }

        .font-fantasy {
            font-family: 'Shippori Mincho', serif;
        }

        /* Neon Glow Effects */
        .glow-gold {
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.5), inset 0 0 15px rgba(255, 236, 153, 0.3);
        }
        .glow-magic {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: rgba(26, 20, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(217, 119, 6, 0.25);
        }

        .glass-card {
            background: rgba(38, 30, 60, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Custom Buttons */
        .btn-hover {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            filter: brightness(1.18);
        }
        .btn-hover:active {
            transform: translateY(1px);
            filter: brightness(0.92);
        }

        /* Magic Circle Rotation */
        @keyframes magicSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-magic {
            animation: magicSpin 12s linear infinite;
        }
        .animate-crank {
            animation: magicSpin 0.7s ease-in-out;
        }

        /* Bouncing Sphere Animation */
        @keyframes orbFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-7px) scale(1.05); }
        }
        .orb-float {
            animation: orbFloat 2.5s ease-in-out infinite alternate;
        }

        /* Dropping Capsule Animation */
        @keyframes dropCapsule {
            0% { transform: translateY(-30px) scale(0.3) rotate(-180deg); opacity: 0; }
            60% { transform: translateY(8px) scale(1.15) rotate(10deg); opacity: 1; }
            80% { transform: translateY(-4px) scale(0.95); }
            100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
        }
        .animate-drop {
            animation: dropCapsule 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Action Battle Canvas Styling */
        #battle-canvas-container {
            position: relative;
            width: 100%;
            height: 520px;
            background: #05020a;
            border-radius: 1.5rem;
            overflow: hidden;
            border: 2px solid #3b82f6;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.4);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Modal Overlay Fade */
        .modal-enter {
            animation: fadeIn 0.25s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Rarity Border FX */
        .rarity-UR { border: 2px solid #ef4444; box-shadow: 0 0 25px rgba(239, 68, 68, 0.8); background: linear-gradient(135deg, rgba(239,68,68,0.2), rgba(127,29,29,0.4)); }
        .rarity-SSR { border: 2px solid #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.7); background: linear-gradient(135deg, rgba(245,158,11,0.2), rgba(120,53,15,0.4)); }
        .rarity-SR { border: 2px solid #a855f7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.6); background: linear-gradient(135deg, rgba(168,85,247,0.2), rgba(88,28,135,0.4)); }
        .rarity-R { border: 2px solid #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .rarity-N { border: 2px solid #6b7280; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 11, 25, 0.6); border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(217, 119, 6, 0.5); border-radius: 8px; }
    </style>
</head>
<body class="p-3 md:p-6 flex flex-col items-center justify-between">

    <!-- Top Floating Header Controls -->
    <div class="w-full max-w-4xl flex justify-between items-center mb-3 px-2">
        <button onclick="openModal('modal-stats')" class="bg-amber-950/60 hover:bg-amber-900/80 p-2.5 rounded-full text-amber-200 text-sm border border-amber-600/40 transition">
            <i class="fa-solid fa-scroll text-amber-400 text-base"></i>
        </button>
        <div class="flex items-center space-x-2">
            <button id="bgm-toggle" onclick="toggleBGM()" class="bg-slate-800/80 hover:bg-slate-700 p-2.5 rounded-full text-slate-300 text-sm border border-slate-700 transition">
                <i id="bgm-icon" class="fa-solid fa-volume-xmark text-slate-400"></i>
            </button>
            <button onclick="openModal('modal-settings')" class="bg-slate-800/80 hover:bg-slate-700 p-2.5 rounded-full text-slate-300 text-sm border border-slate-700 transition">
                <i class="fa-solid fa-gear text-slate-300"></i>
            </button>
        </div>
    </div>

    <!-- Title Bar -->
    <div class="text-center mb-4">
        <h1 class="font-fantasy text-2xl md:text-4xl font-extrabold text-amber-300 drop-shadow-[0_2px_12px_rgba(245,158,11,0.6)] tracking-wider flex items-center justify-center gap-2">
            <span>⚔️</span> 勇者の世界ガチャ <span>🛡️</span>
        </h1>
        <p class="text-xs text-amber-200/70 mt-1">伝説の武器を手に入れ、魔王を討伐せよ！</p>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-4xl space-y-4">

        <!-- Top Status Bar -->
        <div class="glass-panel rounded-2xl p-4 text-xs md:text-sm shadow-xl border-amber-500/30">
            <div class="flex flex-wrap items-center justify-center gap-3 md:gap-6 mb-3">
                <!-- Remaining召喚回数 -->
                <div class="flex items-center space-x-1.5">
                    <span class="text-amber-100/70">召喚残回数:</span>
                    <span id="stat-spins" class="font-bold text-amber-400 text-base md:text-lg">100</span>
                    <span class="text-amber-100/70">回</span>
                </div>

                <!-- Action Button 1 -->
                <button onclick="addSpinsAction()" class="bg-amber-600/80 hover:bg-amber-500 text-amber-950 font-bold px-3.5 py-1 rounded-full text-xs btn-hover border border-amber-300/40">
                    本日の限界突破 (+50回)
                </button>

                <!-- EXP Stats -->
                <div class="flex items-center space-x-1 bg-purple-900/40 px-3 py-1 rounded-full border border-purple-500/40">
                    <i class="fa-solid fa-wand-magic-sparkles text-purple-300 text-xs"></i>
                    <span class="text-purple-200">勇者経験値:</span>
                    <span id="stat-exp" class="font-bold text-purple-300">0</span>
                </div>

                <!-- Action Button 2 -->
                <button onclick="addExpAction()" class="bg-purple-600/80 hover:bg-purple-500 text-white px-3.5 py-1 rounded-full text-xs font-semibold btn-hover border border-purple-400/30">
                    修練を積む
                </button>
            </div>

            <!-- Equipped Weapon Display -->
            <div class="flex items-center justify-between bg-amber-950/40 px-4 py-2 rounded-xl border border-amber-500/30 mb-2">
                <div class="flex items-center space-x-2">
                    <span class="text-amber-400 font-bold text-xs">🗡️ 装備中の武器:</span>
                    <span id="equipped-weapon-name" class="font-bold text-amber-200 text-xs md:text-sm">素手 (攻撃力: 10)</span>
                </div>
                <button onclick="autoEquipBestWeapon()" class="bg-amber-500 hover:bg-amber-400 text-amber-950 text-[11px] font-black px-2.5 py-1 rounded-lg border border-amber-200 btn-hover">
                    最強武器を装備
                </button>
            </div>

            <div class="flex flex-wrap justify-center items-center gap-4 text-xs text-slate-300 pt-2 border-t border-slate-700/60">
                <div class="flex items-center gap-1">
                    <i class="fa-solid fa-gem text-cyan-400"></i>
                    <span>竜のダイヤ: <strong id="stat-diamonds" class="text-cyan-300">0</strong> 個</span>
                </div>
                <div>
                    <span>通算召喚数: <strong id="stat-total-pulls" class="text-white">0</strong> 回</span>
                </div>
                <div class="text-slate-400">
                    本日の祈り上限: <span id="stat-daily-limit" class="text-amber-300">0/500</span> 回 (毎日16時に試練リセット)
                </div>
            </div>
        </div>

        <!-- Main Interactive Layout -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-stretch">

            <!-- Left Column: Fantasy Summoning Altar / Gacha Machine -->
            <div class="md:col-span-5 flex flex-col items-center justify-center glass-panel rounded-3xl p-6 relative overflow-hidden">
                <div class="w-full max-w-[260px] flex flex-col items-center">
                    
                    <!-- Fantasy Summoning Vessel -->
                    <div class="w-full bg-gradient-to-b from-amber-700 via-amber-800 to-amber-950 rounded-[45px] p-4 pt-5 pb-6 glow-gold relative flex flex-col items-center shadow-2xl border-2 border-amber-400/60">
                        
                        <!-- Top Crystal Globe containing Elemental Orbs -->
                        <div class="w-full h-48 rounded-full bg-gradient-to-b from-purple-950/60 via-slate-900/80 to-slate-950 border-4 border-amber-400/50 relative overflow-hidden flex items-center justify-center shadow-inner">
                            
                            <!-- Rotating Magic Circle Background -->
                            <div class="absolute w-40 h-40 border border-amber-400/30 rounded-full animate-magic flex items-center justify-center pointer-events-none">
                                <div class="w-28 h-28 border border-purple-400/30 rotate-45"></div>
                            </div>
                            
                            <!-- Glowing Spheres inside Altar -->
                            <div id="capsule-container" class="relative w-full h-full p-4 flex flex-wrap items-center justify-center gap-2 z-10">
                                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-400 to-red-500 border border-amber-200 shadow-[0_0_10px_#f59e0b] orb-float"></div>
                                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-400 to-blue-600 border border-cyan-200 shadow-[0_0_10px_#06b6d4] orb-float" style="animation-delay: 0.3s;"></div>
                                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-purple-400 to-indigo-600 border border-purple-200 shadow-[0_0_10px_#a855f7] orb-float" style="animation-delay: 0.6s;"></div>
                                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-400 to-teal-600 border border-emerald-200 shadow-[0_0_10px_#10b981] orb-float" style="animation-delay: 0.2s;"></div>
                                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-rose-400 to-red-600 border border-rose-200 shadow-[0_0_10px_#f43f5e] orb-float" style="animation-delay: 0.5s;"></div>
                            </div>
                        </div>

                        <!-- Summoning Core / Crank Knob -->
                        <div class="mt-4 w-full flex flex-col items-center z-10">
                            
                            <!-- Ancient Wheel Knob -->
                            <div class="relative w-20 h-10 bg-amber-950 rounded-full border-2 border-amber-500 flex items-center justify-center shadow-md my-1">
                                <div id="gacha-crank" onclick="spinGacha(1)" class="w-14 h-6 bg-gradient-to-r from-amber-300 via-amber-500 to-amber-200 rounded-full border-2 border-amber-700 flex items-center justify-between px-1 cursor-pointer hover:brightness-125 shadow-lg">
                                    <div class="w-4 h-4 rounded-full bg-amber-900 border border-amber-400"></div>
                                    <div class="w-4 h-4 rounded-full bg-amber-800 border border-amber-400"></div>
                                </div>
                            </div>

                            <!-- Item Release Chute -->
                            <div class="w-24 h-12 bg-slate-950 rounded-b-3xl border-t-4 border-amber-900 flex items-center justify-center overflow-hidden relative shadow-inner mt-2">
                                <div id="dropped-capsule-slot" class="w-8 h-8 rounded-full hidden"></div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Right Column: Action Buttons Grid -->
            <div class="md:col-span-7 flex flex-col justify-between space-y-2.5">
                
                <!-- Open World Adventure Button -->
                <button onclick="openWorldAdventure()" class="w-full py-4 bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-700 hover:from-emerald-500 hover:to-teal-500 text-amber-100 font-black text-lg rounded-2xl shadow-xl border-2 border-emerald-300/80 btn-hover flex items-center justify-center space-x-2 glow-gold">
                    <span class="text-2xl">🌍</span>
                    <span>広大な世界へ冒険に出かける！ (3Dオープンワールド)</span>
                </button>

                <!-- Summon Buttons Row -->
                <div class="grid grid-cols-3 gap-2">
                    <!-- Single Summon -->
                    <button onclick="spinGacha(1)" class="py-3 bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 text-amber-950 font-black text-xs md:text-sm rounded-xl shadow border border-amber-300/50 btn-hover text-center">
                        召喚 (1連)
                    </button>

                    <!-- 10x Summon -->
                    <button onclick="spinGacha(10)" class="py-3 bg-gradient-to-r from-purple-600 to-indigo-700 hover:from-purple-500 text-amber-200 font-black text-xs md:text-sm rounded-xl shadow border border-purple-300/40 btn-hover text-center">
                        ✨ 10連召喚
                    </button>

                    <!-- 100x Summon -->
                    <button onclick="spinGacha(100)" class="py-3 bg-gradient-to-r from-rose-600 via-amber-600 to-red-600 hover:brightness-125 text-amber-100 font-black text-xs md:text-sm rounded-xl shadow border-2 border-amber-300 btn-hover text-center glow-gold">
                        💥 神速100連!
                    </button>
                </div>

                <!-- Menu Buttons Grid -->
                <div class="grid grid-cols-2 gap-2 pt-1">
                    <!-- インベントリ (Inventory) -->
                    <button onclick="openModal('modal-inventory')" class="bg-indigo-950/80 hover:bg-indigo-900/90 text-indigo-100 font-bold py-3 px-3 rounded-xl border border-indigo-800/60 btn-hover flex items-center justify-center space-x-2 text-sm">
                        <span class="text-amber-400"><i class="fa-solid fa-box-archive"></i></span>
                        <span>所持装備・道具</span>
                    </button>

                    <!-- アップデート (Updates) -->
                    <button onclick="openModal('modal-updates')" class="bg-teal-950/80 hover:bg-teal-900/90 text-teal-100 font-bold py-3 px-3 rounded-xl border border-teal-800/60 btn-hover flex items-center justify-center space-x-2 text-sm">
                        <span class="text-teal-400"><i class="fa-solid fa-feather-pointed"></i></span>
                        <span>王国の告知</span>
                    </button>

                    <!-- ローカルガチャ (Local Event) -->
                    <button onclick="openModal('modal-local')" class="bg-amber-950/80 hover:bg-amber-900/90 text-amber-100 font-bold py-3 px-3 rounded-xl border border-amber-800/60 btn-hover flex items-center justify-center space-x-2 text-sm">
                        <span class="text-amber-400"><i class="fa-solid fa-dungeon"></i></span>
                        <span>ダンジョン召喚</span>
                    </button>

                    <!-- クエスト (Tasks) -->
                    <button onclick="openModal('modal-tasks')" class="bg-amber-950/80 hover:bg-amber-900/90 text-amber-100 font-bold py-3 px-3 rounded-xl border border-amber-800/60 btn-hover flex items-center justify-center space-x-2 text-sm">
                        <span class="text-amber-300"><i class="fa-solid fa-book-bookmark"></i></span>
                        <span>勇者クエスト</span>
                    </button>

                    <!-- トレード (Trade) -->
                    <button onclick="openModal('modal-trade')" class="bg-cyan-950/80 hover:bg-cyan-900/90 text-cyan-100 font-bold py-3 px-3 rounded-xl border border-cyan-800/60 btn-hover flex items-center justify-center space-x-2 text-sm">
                        <span class="text-cyan-400"><i class="fa-solid fa-handshake-simple"></i></span>
                        <span>錬金交易所</span>
                    </button>

                    <!-- 音楽 (Music) -->
                    <button onclick="toggleBGM()" class="bg-purple-950/80 hover:bg-purple-900/90 text-purple-100 font-bold py-3 px-3 rounded-xl border border-purple-800/60 btn-hover flex items-center justify-center space-x-2 text-sm">
                        <span class="text-purple-300"><i class="fa-solid fa-music"></i></span>
                        <span>冒険のBGM</span>
                    </button>

                    <!-- ショート動画 (Short Video) -->
                    <button onclick="watchShortVideo()" class="bg-pink-950/80 hover:bg-pink-900/90 text-pink-100 font-bold py-3 px-3 rounded-xl border border-pink-800/60 btn-hover flex items-center justify-center space-x-2 text-sm">
                        <span class="text-pink-400"><i class="fa-solid fa-clapperboard"></i></span>
                        <span>預言の水晶</span>
                    </button>

                </div>

                <!-- ライブ (Live Stream) -->
                <button onclick="openModal('modal-live')" class="w-full py-2.5 bg-slate-800/90 hover:bg-slate-700/90 text-rose-300 font-bold rounded-xl border border-slate-700/80 btn-hover flex items-center justify-center space-x-2 text-sm">
                    <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
                    <i class="fa-solid fa-broadcast-tower text-rose-500 text-xs"></i>
                    <span>魔王城中継（ライブ）</span>
                </button>

            </div>
        </div>

        <!-- Bottom Container: Brave Diamond Leaderboard -->
        <div class="glass-panel rounded-2xl p-4 text-center border-amber-500/30">
            <h2 class="font-fantasy text-base font-bold text-amber-300 mb-3 flex items-center justify-center gap-2">
                <span>💎</span> 勇者ダイヤモンドランキング <span>💎</span>
            </h2>

            <div class="grid grid-cols-3 gap-3 text-xs md:text-sm">
                <!-- Rank 2 -->
                <div class="glass-card rounded-xl p-3 flex flex-col items-center border-slate-700">
                    <span class="text-slate-400 font-bold text-xs mb-1">🥈 2位</span>
                    <span id="rank2-name" class="font-bold text-slate-200">大魔導士レオ</span>
                    <span id="rank2-score" class="text-cyan-400 text-xs mt-1">💎 1,420</span>
                </div>

                <!-- Rank 1 -->
                <div class="glass-card rounded-xl p-3 flex flex-col items-center border-amber-500/60 bg-amber-500/10">
                    <span class="text-amber-400 font-bold text-xs mb-1">🥇 1位 (あなた)</span>
                    <span id="rank1-name" class="font-extrabold text-amber-200">伝説の勇者</span>
                    <span id="rank1-score" class="text-cyan-300 font-bold text-xs mt-1">💎 <span id="user-rank-diamonds">0</span></span>
                </div>

                <!-- Rank 3 -->
                <div class="glass-card rounded-xl p-3 flex flex-col items-center border-slate-700">
                    <span class="text-amber-700 font-bold text-xs mb-1">🥉 3位</span>
                    <span id="rank3-name" class="font-bold text-slate-200">聖騎士アルフレッド</span>
                    <span id="rank3-score" class="text-cyan-400 text-xs mt-1">💎 980</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Modals Structure -->
    <!-- Result / Info Modal -->
    <div id="modal-container" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div id="modal-content" class="glass-panel border-amber-500/50 rounded-3xl p-6 max-w-lg w-full text-center relative modal-enter max-h-[90vh] overflow-y-auto">
            <h3 id="modal-title" class="font-fantasy text-2xl font-bold text-amber-300 mb-4">結果</h3>
            <div id="modal-body" class="mb-6 space-y-3"></div>
            <button onclick="closeModal()" class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-amber-950 font-bold text-lg rounded-xl btn-hover">
                閉じる
            </button>
        </div>
    </div>

    <!-- JavaScript Game Logic -->
    <script>
        // Game State
        const state = {
            spins: 100,
            exp: 0,
            diamonds: 0,
            totalPulls: 0,
            dailyLimitUsed: 0,
            dailyLimitMax: 500,
            inventory: {},
            equippedWeapon: null,
            bgmPlaying: false
        };

        // World & Battle State
        let battleLoopId = null;
        let threeScene = null, threeCamera = null, threeRenderer = null;
        let heroMesh = null, bossMesh = null, swordMesh = null;
        let projectiles3D = [];
        let worldObjects = [];
        let enemySoldiers = []; // 敵兵士たちの配列
        let temples = []; // 神殿の配列
        let bossAuraMesh = null;
        let isAdventureMode = false;

        const battleState = {
            active: false,
            hero: { x: 0, y: 0, z: 20, radius: 0.8, speed: 0.35, hp: 100, maxHp: 100, vy: 0, isGrounded: true },
            boss: { x: 0, z: -180, radius: 2.5, hp: 10000, maxHp: 10000, attackTimer: 0 },
            keys: { Up: false, Down: false, Left: false, Right: false, Jump: false }
        };

        // Utility: Get Rarity Text Color Class
        function getRarityTextColor(rarity) {
            switch(rarity) {
                case 'UR': return 'text-red-400';
                case 'SSR': return 'text-amber-400';
                case 'SR': return 'text-purple-400';
                case 'R': return 'text-blue-400';
                case 'N': return 'text-slate-300';
                default: return 'text-white';
            }
        }

        // Modal Controls
        function openModal(id) {
            if (actionMap[id]) {
                const [title, body] = actionMap[id];
                showInfoModal(title, body);
                return;
            }

            if (id === 'modal-inventory') {
                showInventoryModal();
                return;
            }

            const modal = document.getElementById(id);
            if (modal) {
                modal.classList.remove('hidden');
            }
        }

        function closeModal() {
            stopBattle();
            document.getElementById('modal-container').classList.add('hidden');
        }

        function showInfoModal(title, bodyText) {
            stopBattle();
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = `
                <div class="text-sm text-slate-200 whitespace-pre-line leading-relaxed">${bodyText}</div>
            `;
            document.getElementById('modal-container').classList.remove('hidden');
        }

        function showInventoryModal() {
            stopBattle();
            document.getElementById('modal-title').innerText = '🎒 所持装備・道具';

        // Web Audio Synthesizer Sound Effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type = 'sine', duration = 0.15) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

            const totalWeight = itemPool.reduce((sum, item) => sum + item.weight, 0);
            let rand = Math.random() * totalWeight;
            for (const item of itemPool) {
                if (rand < item.weight) return item;
                rand -= item.weight;
            }
            return itemPool[itemPool.length - 1];
        }

        // Spin Gacha Core Logic
        function spinGacha(count) {
            if (state.spins < count) {
                showInfoModal('召喚力不足', `召喚残回数が足りません！ (必要: ${count}回)\n「本日の限界突破」や「修練」で補充してください。`);
                return;
            }

            if (state.dailyLimitUsed + count > state.dailyLimitMax) {
                showInfoModal('試練制限', `本日の召喚上限(${state.dailyLimitMax}回)に達します。`);
                return;
            }

            // Deduct spins
            state.spins -= count;
            state.dailyLimitUsed += count;
            state.totalPulls += count;

            const crank = document.getElementById('gacha-crank');
            crank.classList.add('animate-crank');
            playGachaSound();

            setTimeout(() => {
                crank.classList.remove('animate-crank');

                const results = [];
                let hasUR = false;

                for (let i = 0; i < count; i++) {
                    const item = getRandomItem();
                    results.push(item);

                    // Add to Inventory
                    state.inventory[item.id] = (state.inventory[item.id] || 0) + 1;
                    state.diamonds += item.value;
                    state.exp += 5;

                    if (item.rarity === 'UR') hasUR = true;
                }

                // Automatically equip if better than current
                autoEquipBestWeaponSilent();

                if (hasUR) {
                    playURSound();
                    confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
                }

                // Show Results
                showGachaResultModal(results);
                updateUI();
            }, 600);
        }

        // --- Touch & Mouse Input Handlers ---
        let joystickActive = false;
        let joystickCenter = { x: 0, y: 0 };
        let activeControls = false;

        function setupTouchControls(container) {
            const joystickZone = document.getElementById('joystick-zone');
            const joystickKnob = document.getElementById('joystick-knob');
            if (!joystickZone || !joystickKnob) return;

            let cameraTouchId = null;
            let joystickTouchId = null;
            let prevCamX = 0;

            // Touch Start
            container.onpreventcontextmenu = (e) => e.preventDefault();

            container.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    const rect = joystickZone.getBoundingClientRect();
                    
                    if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                        touch.clientY >= rect.top && touch.clientY <= rect.bottom && joystickTouchId === null) {
                        joystickTouchId = touch.identifier;
                        joystickActive = true;
                        joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                        updateJoystick(touch.clientX, touch.clientY);
                    } else if (touch.clientX > window.innerWidth / 2 && cameraTouchId === null) {
                        cameraTouchId = touch.identifier;
                        prevCamX = touch.clientX;
                    }
                }
            }, { passive: false });

            // Touch Move
            container.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joystickTouchId && joystickActive) {
                        updateJoystick(touch.clientX, touch.clientY);
                    } else if (touch.identifier === cameraTouchId && heroMesh) {
                        const deltaX = touch.clientX - prevCamX;
                        heroMesh.rotation.y -= deltaX * 0.008;
                        prevCamX = touch.clientX;
                    }
                }
            }, { passive: false });

            const handleTouchEnd = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joystickTouchId) {
                        joystickTouchId = null;
                        joystickActive = false;
                        resetJoystick();
                    } else if (touch.identifier === cameraTouchId) {
                        cameraTouchId = null;
                    }
                }
            };
            container.addEventListener('touchend', handleTouchEnd);
            container.addEventListener('touchcancel', handleTouchEnd);

            // Mouse Drag Support for Joystick
            joystickZone.onmousedown = (e) => {
                e.preventDefault();
                const rect = joystickZone.getBoundingClientRect();
                joystickActive = true;
                joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                updateJoystick(e.clientX, e.clientY);

                const onMouseMove = (me) => {
                    if (joystickActive) updateJoystick(me.clientX, me.clientY);
                };
                const onMouseUp = () => {
                    joystickActive = false;
                    resetJoystick();
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                };
                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
            };
        }

        function updateJoystick(clientX, clientY) {
            const joystickKnob = document.getElementById('joystick-knob');
            if (!joystickKnob) return;

            const dx = clientX - joystickCenter.x;
            const dy = clientY - joystickCenter.y;
            const dist = Math.hypot(dx, dy);
            const maxRadius = 38;

            const angle = Math.atan2(dy, dx);
            const clampedDist = Math.min(dist, maxRadius);

            const knobX = Math.cos(angle) * clampedDist;
            const knobY = Math.sin(angle) * clampedDist;

            joystickKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;

            const deadzone = 8;
            if (dist > deadzone) {
                battleState.keys.joystickDx = knobX / maxRadius;
                battleState.keys.joystickDz = knobY / maxRadius;
            } else {
                battleState.keys.joystickDx = 0;
                battleState.keys.joystickDz = 0;
            }
        }

        function resetJoystick() {
            const joystickKnob = document.getElementById('joystick-knob');
            if (joystickKnob) joystickKnob.style.transform = 'translate(0px, 0px)';
            battleState.keys.joystickDx = 0;
            battleState.keys.joystickDz = 0;
        }

                    soldierGroup.position.set(sx, 0, sz);
                    threeScene.add(soldierGroup);

                    enemySoldiers.push({
                        mesh: soldierGroup,
                        x: sx,
                        z: sz,
                        hp: 150,
                        maxHp: 150,
                        speed: 0.08,
                        alive: true
                    });
                }
            }

            // Chests
            for (let i = 0; i < 8; i++) {
                const cx = (Math.random() - 0.5) * 300;
                const cz = (Math.random() - 0.5) * 300;
                const chest = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.8 }));
                chest.position.set(cx, 0.6, cz);
                chest.castShadow = true;
                threeScene.add(chest);
                worldObjects.push({ mesh: chest, type: 'chest', x: cx, z: cz, opened: false });
            }

            // Demon Lord Temple/Castle Structure
            const castleGroup = new THREE.Group();
            const hallFloor = new THREE.Mesh(new THREE.BoxGeometry(40, 0.5, 60), new THREE.MeshStandardMaterial({ color: 0x090514, roughness: 0.1, metalness: 0.8 }));
            hallFloor.position.set(0, 0.25, -220);
            hallFloor.receiveShadow = true;
            castleGroup.add(hallFloor);

            const hallColGeo = new THREE.CylinderGeometry(1.5, 1.5, 18, 16);
            const hallColMat = new THREE.MeshStandardMaterial({ color: 0x18181b, metalness: 0.6 });
            [-240, -220, -200].forEach(cz => {
                const lCol = new THREE.Mesh(hallColGeo, hallColMat);
                lCol.position.set(-16, 9, cz);
                const rCol = new THREE.Mesh(hallColGeo, hallColMat);
                rCol.position.set(16, 9, cz);
                castleGroup.add(lCol);
                castleGroup.add(rCol);
            });

            threeScene.add(castleGroup);

            // Hero & Boss Mesh
            createHeroMesh();
            createBossMesh(battleState.boss.x, battleState.boss.z);

            if (battleLoopId) cancelAnimationFrame(battleLoopId);
            battleLoopId = requestAnimationFrame(run3DWorldLoop);
        }

        function createHeroMesh() {
            const heroGroup = new THREE.Group();
            
            // Armor
            const armorGeo = new THREE.BoxGeometry(0.8, 1.0, 0.6);
            const armorMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, metalness: 0.8, roughness: 0.2 });
            const armor = new THREE.Mesh(armorGeo, armorMat);
            armor.position.y = 1.0;
            armor.castShadow = true;
            heroGroup.add(armor);

            // Shoulders
            const shoulderGeo = new THREE.BoxGeometry(0.4, 0.35, 0.5);
            const shoulderMat = new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.7, roughness: 0.3 });
            const leftShoulder = new THREE.Mesh(shoulderGeo, shoulderMat);
            leftShoulder.position.set(-0.55, 1.4, 0);
            leftShoulder.castShadow = true;
            const rightShoulder = new THREE.Mesh(shoulderGeo, shoulderMat);
            rightShoulder.position.set(0.55, 1.4, 0);
            rightShoulder.castShadow = true;
            heroGroup.add(leftShoulder);
            heroGroup.add(rightShoulder);

            // Helmet & Visor
            const helmGeo = new THREE.BoxGeometry(0.65, 0.65, 0.65);
            const helmMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.9, roughness: 0.1 });
            const helm = new THREE.Mesh(helmGeo, helmMat);
            helm.position.y = 1.8;
            helm.castShadow = true;
            heroGroup.add(helm);

            const visorGeo = new THREE.BoxGeometry(0.5, 0.12, 0.67);
            const visorMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
            const visor = new THREE.Mesh(visorGeo, visorMat);
            visor.position.set(0, 1.82, 0.01);
            heroGroup.add(visor);

            // Shield
            const shieldGeo = new THREE.BoxGeometry(0.1, 1.1, 0.8);
            const shieldMat = new THREE.MeshStandardMaterial({ color: 0x1e3a8a, metalness: 0.8, roughness: 0.2 });
            const shield = new THREE.Mesh(shieldGeo, shieldMat);
            shield.position.set(-0.65, 1.0, 0.2);
            shield.castShadow = true;
            heroGroup.add(shield);

            // Sword
            const swordGroup = new THREE.Group();
            const swordBladeGeo = new THREE.BoxGeometry(0.12, 1.6, 0.25);
            const swordBladeMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.95, roughness: 0.1, emissive: 0xb45309, emissiveIntensity: 0.5 });
            const swordBlade = new THREE.Mesh(swordBladeGeo, swordBladeMat);
            swordBlade.position.y = 0.8;
            swordBlade.castShadow = true;
            swordGroup.add(swordBlade);

            swordGroup.position.set(0.65, 1.0, 0.1);
            swordMesh = swordGroup;
            heroGroup.add(swordMesh);

            heroGroup.position.set(battleState.hero.x, battleState.hero.y, battleState.hero.z);
            heroMesh = heroGroup;
            threeScene.add(heroMesh);
        }

        // --- Demon Lord Boss 3D Mesh Creator ---
        function createBossMesh(bx, bz) {
            const bossGroup = new THREE.Group();

            // 1. Torso / Armor (巨大な漆黒の胴体)
            const bodyGeo = new THREE.BoxGeometry(3.5, 5.0, 2.5);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x18181b, metalness: 0.7, roughness: 0.3 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 3.5;
            body.castShadow = true;
            bossGroup.add(body);

            // Crimson Chest Emblem (赤く光る胸の紋章)
            const coreGeo = new THREE.SphereGeometry(0.9, 16, 16);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
            const core = new THREE.Mesh(coreGeo, coreMat);
            core.position.set(0, 4.2, 1.3);
            bossGroup.add(core);

            // 2. Head & Glowing Eyes (頭部と赤い邪眼)
            const headGeo = new THREE.BoxGeometry(2.0, 2.0, 2.0);
            const headMat = new THREE.MeshStandardMaterial({ color: 0x090514, metalness: 0.9 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 7.0;
            head.castShadow = true;
            bossGroup.add(head);

            const eyeGeo = new THREE.BoxGeometry(0.4, 0.2, 0.2);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-0.5, 7.2, 1.05);
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.5, 7.2, 1.05);
            bossGroup.add(leftEye);
            bossGroup.add(rightEye);

            // 3. Huge Curved Horns (巨大なふたつの角)
            const hornGeo = new THREE.ConeGeometry(0.6, 3.5, 8);
            const hornMat = new THREE.MeshStandardMaterial({ color: 0x7f1d1d, metalness: 0.8 });
            
            const leftHorn = new THREE.Mesh(hornGeo, hornMat);
            leftHorn.position.set(-1.2, 8.8, 0);
            leftHorn.rotation.z = -0.4;
            leftHorn.rotation.x = -0.2;
            leftHorn.castShadow = true;

            const rightHorn = new THREE.Mesh(hornGeo, hornMat);
            rightHorn.position.set(1.2, 8.8, 0);
            rightHorn.rotation.z = 0.4;
            rightHorn.rotation.x = -0.2;
            rightHorn.castShadow = true;

            bossGroup.add(leftHorn);
            bossGroup.add(rightHorn);

            // 4. Wings of Darkness (漆黒の巨大な翼)
            const wingGeo = new THREE.BoxGeometry(5.5, 3.0, 0.2);
            const wingMat = new THREE.MeshStandardMaterial({ color: 0x450a0a, roughness: 0.4 });
            
            const leftWing = new THREE.Mesh(wingGeo, wingMat);
            leftWing.position.set(-3.5, 5.5, -1.2);
            leftWing.rotation.y = 0.3;
            leftWing.rotation.z = 0.2;
            leftWing.castShadow = true;

            const rightWing = new THREE.Mesh(wingGeo, wingMat);
            rightWing.position.set(3.5, 5.5, -1.2);
            rightWing.rotation.y = -0.3;
            rightWing.rotation.z = -0.2;
            rightWing.castShadow = true;

            bossGroup.add(leftWing);
            bossGroup.add(rightWing);

            // 5. Aura Ring at Feet (足元の赤い魔法陣リング)
            const auraGeo = new THREE.TorusGeometry(3.8, 0.15, 16, 64);
            const auraMat = new THREE.MeshBasicMaterial({ color: 0xef4444, wireframe: true });
            bossAuraMesh = new THREE.Mesh(auraGeo, auraMat);
            bossAuraMesh.rotation.x = Math.PI / 2;
            bossAuraMesh.position.y = 0.1;
            bossGroup.add(bossAuraMesh);

            bossGroup.position.set(bx, 0, bz);
            bossMesh = bossGroup;
            threeScene.add(bossMesh);
        }

        function run3DWorldLoop() {
            if (!battleState.active) return;

            const h = battleState.hero;
            const keys = battleState.keys;

            // Camera relative direction calculation
            const camRotY = heroMesh ? heroMesh.rotation.y : 0;
            let moveDx = 0;
            let moveDz = 0;

            // W: 前進 / S: 後退
            if (keys.Up || keys.w || keys.W) moveDz += 1;
            if (keys.Down || keys.s || keys.S) moveDz -= 1;
            // A: 左 / D: 右 (カメラ視点に対して正しくAで左、Dで右へ移動)
            if (keys.Left || keys.a || keys.A) moveDx += 1;
            if (keys.Right || keys.d || keys.D) moveDx -= 1;

            if (keys.joystickDx !== undefined && (keys.joystickDx !== 0 || keys.joystickDz !== 0)) {
                moveDx = keys.joystickDx;
                moveDz = keys.joystickDz;
            }

            // Normalization & Movement
            const length = Math.hypot(moveDx, moveDz);
            if (length > 0) {
                const nx = moveDx / (length > 1 ? length : 1);
                const nz = moveDz / (length > 1 ? length : 1);

                const worldDx = nx * Math.cos(camRotY) + nz * Math.sin(camRotY);
                const worldDz = -nx * Math.sin(camRotY) + nz * Math.cos(camRotY);

                h.x += worldDx * h.speed;
                h.z += worldDz * h.speed;
            }

            // Jump Physics & Gravity
            if (keys.Jump && h.isGrounded) {
                h.vy = 0.55;
                h.isGrounded = false;
                playTone(400, 'square', 0.1);

                // 神殿内でのジャンプワープ判定
                temples.forEach(t => {
                    const distToTemple = Math.hypot(h.x - t.x, h.z - t.z);
                    if (distToTemple < t.radius) {
                        // 魔王の神殿（玉座の間）の目の前へ転送！
                        h.x = battleState.boss.x;
                        h.z = battleState.boss.z + 18;
                        const locText = document.getElementById('location-text');
                        if (locText) locText.innerText = '📍 場所: 魔王の決戦神殿';
                        playURSound();
                        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    }
                });
            }

            if (!h.isGrounded) {
                h.y += h.vy;
                h.vy -= 0.035; // Gravity
                if (h.y <= 0) {
                    h.y = 0;
                    h.vy = 0;
                    h.isGrounded = true;
                }
            }

            // Sync Hero Mesh Position
            if (heroMesh) {
                heroMesh.position.set(h.x, h.y, h.z);
            }

            // Third-Person Camera Tracking
            if (threeCamera && heroMesh) {
                const camDistance = 14;
                const camHeight = 7;
                threeCamera.position.x = h.x - Math.sin(camRotY) * camDistance;
                threeCamera.position.z = h.z - Math.cos(camRotY) * camDistance;
                threeCamera.position.y = h.y + camHeight;
                threeCamera.lookAt(h.x, h.y + 1.8, h.z);
            }

            // Boss Rotate & Aura Animation
            if (bossMesh) {
                if (bossAuraMesh) bossAuraMesh.rotation.z += 0.02;
                bossMesh.lookAt(h.x, 0, h.z);
            }

            // Enemy Soldiers Movement & Automatic Attack
            enemySoldiers.forEach(e => {
                if (!e.alive) return;
                const distToHero = Math.hypot(h.x - e.x, h.z - e.z);

                if (distToHero < 25) {
                    // Chase hero
                    const ex = (h.x - e.x) / distToHero;
                    const ez = (h.z - e.z) / distToHero;
                    e.x += ex * e.speed;
                    e.z += ez * e.speed;
                    e.mesh.position.set(e.x, 0, e.z);
                    e.mesh.lookAt(h.x, 0, h.z);

                    // Hero auto-attack when in range
                    if (distToHero < 3.0) {
                        const heroAtk = state.equippedWeapon ? state.equippedWeapon.atk : 10;
                        e.hp -= heroAtk * 0.05;
                        if (e.hp <= 0) {
                            e.alive = false;
                            threeScene.remove(e.mesh);
                            state.diamonds += 10;
                            state.exp += 15;
                            updateUI();
                            playTone(880, 'sine', 0.1);
                        }
                    }
                }
            });

            // Chest Pickup Detection
            worldObjects.forEach(obj => {
                if (obj.type === 'chest' && !obj.opened) {
                    const dist = Math.hypot(h.x - obj.x, h.z - obj.z);
                    if (dist < 2.5) {
                        obj.opened = true;
                        threeScene.remove(obj.mesh);
                        state.diamonds += 100;
                        state.spins += 5;
                        updateUI();
                        playURSound();
                        confetti({ particleCount: 40, spread: 60 });
                    }
                }
            });

            // Boss Attack & Barrage AI
            const b = battleState.boss;
            const distToBoss = Math.hypot(h.x - b.x, h.z - b.z);

            if (distToBoss < 70) {
                b.attackTimer++;
                if (b.attackTimer % 90 === 0) {
                    // Fire 3D Energy Projectiles
                    const pGeo = new THREE.SphereGeometry(0.8, 12, 12);
                    const pMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
                    const pMesh = new THREE.Mesh(pGeo, pMat);
                    pMesh.position.set(b.x, 3.5, b.z);
                    threeScene.add(pMesh);

                    const vx = (h.x - b.x) / distToBoss * 0.6;
                    const vz = (h.z - b.z) / distToBoss * 0.6;
                    projectiles3D.push({ mesh: pMesh, x: b.x, z: b.z, vx, vz, life: 120 });
                }

                // Automatic Hero Damage to Boss when Close
                if (distToBoss < 8.0) {
                    const heroAtk = state.equippedWeapon ? state.equippedWeapon.atk : 10;
                    b.hp = Math.max(0, b.hp - heroAtk * 0.05);

                    const bHpElem = document.getElementById('b-boss-hp');
                    if (bHpElem) bHpElem.innerText = Math.floor(b.hp);

                    if (b.hp <= 0) {
                        stopBattle();
                        state.diamonds += 1000;
                        updateUI();
                        confetti({ particleCount: 300, spread: 120 });
                        showInfoModal('🏆 討伐成功！', '魔王を討伐し、世界に平和が訪れた！\n報酬: 竜のダイヤ +1000個！');
                        return;
                    }
                }
            }

            // Update Projectiles
            for (let i = projectiles3D.length - 1; i >= 0; i--) {
                const p = projectiles3D[i];
                p.x += p.vx;
                p.z += p.vz;
                p.mesh.position.set(p.x, 2, p.z);
                p.life--;

                const pDist = Math.hypot(h.x - p.x, h.z - p.z);
                if (pDist < 1.8) {
                    h.hp = Math.max(0, h.hp - 10);
                    const hHpElem = document.getElementById('b-hero-hp');
                    if (hHpElem) hHpElem.innerText = Math.floor(h.hp);

                    threeScene.remove(p.mesh);
                    projectiles3D.splice(i, 1);

                    if (h.hp <= 0) {
                        stopBattle();
                        showInfoModal('💀 敗北...', '魔王の圧倒的な力の前に倒れた...\n装備を強化して再挑戦しよう！');
                        return;
                    }
                    continue;
                }

                if (p.life <= 0) {
                    threeScene.remove(p.mesh);
                    projectiles3D.splice(i, 1);
                }
            }

            // Render Frame
            threeRenderer.render(threeScene, threeCamera);
            battleLoopId = requestAnimationFrame(run3DWorldLoop);
        }

        // Global Keyboard Event Listeners
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') battleState.keys.Up = true;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') battleState.keys.Down = true;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') battleState.keys.Left = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') battleState.keys.Right = true;
            if (e.code === 'Space') battleState.keys.Jump = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') battleState.keys.Up = false;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') battleState.keys.Down = false;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') battleState.keys.Left = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') battleState.keys.Right = false;
            if (e.code === 'Space') battleState.keys.Jump = false;
        });

        // UI Update Helpers & Actions
        function updateUI() {
            document.getElementById('stat-spins').innerText = state.spins;
            document.getElementById('stat-exp').innerText = state.exp;
            document.getElementById('stat-diamonds').innerText = state.diamonds;
            document.getElementById('stat-total-pulls').innerText = state.totalPulls;
            document.getElementById('stat-daily-limit').innerText = `${state.dailyLimitUsed}/${state.dailyLimitMax}`;
            document.getElementById('user-rank-diamonds').innerText = state.diamonds;

            const eqElem = document.getElementById('equipped-weapon-name');
            if (state.equippedWeapon) {
                eqElem.innerText = `${state.equippedWeapon.name} (攻撃力: ${state.equippedWeapon.atk})`;
            } else {
                eqElem.innerText = '素手 (攻撃力: 10)';
            }
        }

        function addSpinsAction() {
            state.spins += 50;
            updateUI();
            playURSound();
            confetti({ particleCount: 50, spread: 50 });
        }

        function addExpAction() {
            state.exp += 100;
            state.spins += 10;
            updateUI();
            playTone(600, 'sine', 0.2);
        }

        function watchShortVideo() {
            showInfoModal('🔮 預言の水晶', '預言の動画を閲覧しました！\n【報酬】召喚回数 +20回 & 竜のダイヤ +50個');
            state.spins += 20;
            state.diamonds += 50;
            updateUI();
        }

        // Action Map Modals Content
        const actionMap = {
            'modal-stats': ['📜 勇者のステータス', '現在の能力値と実績:\n・限界突破済みレベル\n・累計討伐数: 12体\n・取得タイトル: 伝説の兆し'],
            'modal-settings': ['⚙️ 設定', '・音量バランス調整\n・画質: 高画質 (3D WebGL)\n・操作感度: 標準'],
            'modal-updates': ['📜 王国の告示', '【バージョン2.0アップデート】\n・3Dオープンワールド機能の実装！\n・古代神殿と敵兵士の徘徊システム追加！\n・神殿内ワープによる魔王決戦機能を実装！'],
            'modal-local': ['🏛️ ダンジョン召喚', '地下ダンジョンの秘宝ガチャ！SR以上の装備排出率が2倍！'],
            'modal-tasks': ['📜 勇者クエスト', '1. 敵兵士を5体撃破する (達成!)\n2. 宝箱を3つ開放する\n3. 魔王城の神殿へ潜入する'],
            'modal-trade': ['⚖️ 錬金交易所', '不用なNランク装備をまとめることで「竜のダイヤ」に分解錬金ができます。'],
            'modal-live': ['📺 魔王城ライブ中継', '魔王城の玉座の間からリアルタイム中継中！魔王が邪悪なオーラを溜めています...！']
        };

        // Window Init
        window.onload = function() {
            updateUI();
        };
    </script>
