<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>歯医者さん経営シミュレーション 3D</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }
        /* Glassmorphism Styling */
        .glass-panel {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .btn-action {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 14px 0 rgba(0, 0, 0, 0.35);
        }
        .btn-action:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100" oncontextmenu="return false;">

    <!-- 3D Scene Canvas -->
    <div id="canvas-container"></div>

    <!-- Top Status Bar (Money, Reputation, Auto-Save status) -->
    <div class="fixed top-3 left-3 right-3 flex justify-between items-center z-20 pointer-events-none">
        <div class="flex items-center gap-2">
            <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-2 pointer-events-auto">
                <i class="fa-solid fa-coins text-amber-400 text-lg"></i>
                <div>
                    <div class="text-[10px] text-slate-400 font-bold uppercase">資金</div>
                    <div id="ui-money" class="text-base font-extrabold text-amber-300">¥100,000</div>
                </div>
            </div>
            <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-2 pointer-events-auto">
                <i class="fa-solid fa-star text-yellow-400 text-lg"></i>
                <div>
                    <div class="text-[10px] text-slate-400 font-bold uppercase">クリニック評判</div>
                    <div id="ui-reputation" class="text-base font-extrabold text-yellow-300">4.5</div>
                </div>
            </div>
        </div>

        <div class="glass-panel px-3 py-2 rounded-2xl flex items-center gap-2 pointer-events-auto">
            <button onclick="saveGameState(true)" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-1 px-3 rounded-xl transition">
                <i class="fa-solid fa-floppy-disk mr-1"></i>保存
            </button>
            <span id="save-indicator" class="text-[10px] text-emerald-400 font-bold hidden animate-pulse">保存完了</span>
        </div>
    </div>

    <!-- Keyboard & Touch Controls Hint Overlay (Top Left, no overlap) -->
    <div class="fixed top-16 left-3 z-20 glass-panel px-3 py-1.5 rounded-xl text-[11px] font-bold text-slate-300 flex items-center gap-2 pointer-events-none">
        <i class="fa-solid fa-gamepad text-cyan-400 text-sm"></i>
        <span>[WASD / 矢印キー] 移動 | [Shift] Shift Lock (<span id="shift-lock-status" class="text-rose-400">OFF</span>)</span>
    </div>

    <!-- Middle-Left: Chair Switcher Toolbar (Moved slightly down to avoid overlapping the guide) -->
    <div class="fixed left-3 top-32 z-20 flex flex-col gap-2">
        <div class="text-[11px] font-bold text-slate-300 px-2 glass-panel py-1 rounded-lg text-center">
            <i class="fa-solid fa-chair mr-1 text-cyan-400"></i>診察台
        </div>
        <div id="chair-selector-list" class="flex flex-col gap-2">
            <!-- Rendered dynamically -->
        </div>
        <button onclick="buyNewChair()" id="btn-buy-chair" class="glass-panel hover:bg-emerald-600/40 text-emerald-300 text-xs font-bold p-2.5 rounded-2xl border border-emerald-500/30 flex flex-col items-center gap-1 transition btn-action">
            <i class="fa-solid fa-plus-circle text-lg"></i>
            <span>チェアー増設</span>
            <span id="ui-chair-cost" class="text-[9px] text-slate-300">¥50,000</span>
        </button>
    </div>

    <!-- Bottom Left: Staff Hiring Toolbar (Solo Doctor + Default Receptionist mode) -->
    <div class="fixed bottom-3 left-3 z-20 flex gap-2">
        <button onclick="hireStaff('doctor')" class="glass-panel hover:bg-slate-800 text-emerald-300 text-xs font-bold p-3 rounded-2xl flex items-center gap-2 border border-emerald-500/30 transition btn-action">
            <i class="fa-solid fa-user-doctor text-lg"></i>
            <div class="text-left">
                <div>治療アシスタント雇用</div>
                <div class="text-[10px] text-slate-400">¥40,000 (現在: <span id="ui-doctor-staff-count">0</span>名)</div>
            </div>
        </button>
    </div>

    <!-- Bottom Right: Compact Patient Treatment Panel -->
    <div class="fixed bottom-3 right-3 z-20 w-72 glass-panel p-3.5 rounded-3xl shadow-2xl border border-slate-700/60">
        <div class="flex items-center justify-between pb-2 border-b border-slate-700/50 mb-2">
            <div class="flex items-center gap-2">
                <span id="patient-icon" class="text-2xl">👤</span>
                <div>
                    <h3 id="patient-name" class="text-sm font-bold text-white">佐藤 健一 様</h3>
                    <p id="patient-symptom" class="text-[11px] text-amber-400 font-medium">虫歯治療・定期検診</p>
                </div>
            </div>
            <span id="chair-badge" class="bg-cyan-500/20 text-cyan-300 text-[10px] font-bold px-2 py-0.5 rounded-full border border-cyan-500/30">台 #1</span>
        </div>

        <!-- Treatment Progress Bar -->
        <div id="treatment-progress-container" class="mb-3 hidden">
            <div class="flex justify-between text-[11px] font-bold mb-1">
                <span class="text-emerald-400"><i class="fa-solid fa-gear fa-spin mr-1"></i>治療進行中...</span>
                <span id="treatment-progress-text" class="text-white">0%</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden p-0.5 border border-slate-700">
                <div id="treatment-progress-bar" class="bg-gradient-to-r from-emerald-500 to-cyan-400 h-full rounded-full transition-all duration-100" style="width: 0%"></div>
            </div>
        </div>

        <!-- Distance Alert or Action Button -->
        <div id="distance-alert" class="text-center py-2 bg-amber-500/10 border border-amber-500/30 rounded-2xl text-amber-300 text-xs font-bold">
            <i class="fa-solid fa-person-walking mr-1"></i>診察台の近くへ移動してください
        </div>

        <button id="btn-treat-action" onclick="window.performSingleTreatment()" class="w-full py-2.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-extrabold text-xs rounded-2xl transition btn-action flex items-center justify-center gap-2 hidden">
            <i class="fa-solid fa-tooth text-sm"></i>
            <span>診察・治療を実行 (E)</span>
        </button>
    </div>

    <!-- Modal Dialog -->
    <div id="game-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel max-w-sm w-full p-5 rounded-3xl border border-slate-700 shadow-2xl text-center space-y-4">
            <h2 id="modal-title" class="text-lg font-black text-white"></h2>
            <div id="modal-body" class="text-xs text-slate-300"></div>
            <button onclick="closeModal()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-2xl transition">
                次へ進む
            </button>
        </div>
    </div>

    <script>
        // --- Global Error Handlers & Helper Setup ---
        window.performSingleTreatment = function() {
            if (typeof startSingleTreatment === 'function') {
                startSingleTreatment();
            }
        };

        // Shift Lock State
        let isShiftLocked = false;

        function toggleShiftLock() {
            isShiftLocked = !isShiftLocked;
            const statusEl = document.getElementById('shift-lock-status');
            if (statusEl) {
                if (isShiftLocked) {
                    statusEl.innerText = 'ON';
                    statusEl.className = 'text-emerald-400 font-extrabold animate-pulse';
                } else {
                    statusEl.innerText = 'OFF';
                    statusEl.className = 'text-rose-400';
                }
            }
        }

        function openModal(title, content) {
            document.getElementById('modal-title').innerHTML = title;
            document.getElementById('modal-body').innerHTML = content;
            document.getElementById('game-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('game-modal').classList.add('hidden');
        }

        // --- Human Patient Templates & Data ---
        const humanPatients = [
            { name: "田中 さくら 様", type: "会社員 (30代)", icon: "👩", symptom: "虫歯治療・痛み相談", reward: 12000, feedback: "とても手際よく治療してくれて痛くなかったです！ありがとうございます。" },
            { name: "佐藤 健一 様", type: "自営業 (40代)", icon: "👨", symptom: "定期検診・歯石除去", reward: 15000, feedback: "先生の説明がすごく分かりやすくて安心できました。" },
            { name: "鈴木 結衣 様", type: "学生 (20代)", icon: "👩‍🎓", symptom: "ホワイトニング相談", reward: 18000, feedback: "歯がすごくキレイになって大満足です！また来ます。" },
            { name: "高橋 蓮 様", type: "小学生 (10代)", icon: "👦", symptom: "フッ素塗布・予防歯科", reward: 10000, feedback: "優しく話しかけてくれて全然怖くなかったよ！" },
            { name: "伊藤 はな 様", type: "主婦 (50代)", icon: "👩‍🦰", symptom: "歯ぐきケア・知覚過敏", reward: 14000, feedback: "落ち着いた雰囲気でリラックスして受診できました。" },
            { name: "渡辺 誠 様", type: "シニア (70代)", icon: "👴", symptom: "入れ歯調整・検診", reward: 16000, feedback: "ぴったり噛み合うようになって食事が楽しくなりました。" }
        ];

        // --- Game State & Auto Save ---
        let gameState = {
            money: 100000,
            reputation: 4.5,
            purchasedChairsCount: 1, // 最初に解放されているのは1台のみ
            receptionStaffCount: 1,  // 最初から1名常駐
            doctorStaffCount: 0,
            activeChairId: 1
        };

        function loadGameState() {
            try {
                const saved = localStorage.getItem('dental_clinic_save_v2');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    gameState = { ...gameState, ...parsed };
                    // 受付スタッフは最低1人保障
                    if (gameState.receptionStaffCount < 1) {
                        gameState.receptionStaffCount = 1;
                    }
                }
            } catch(e) { console.error("Save load error", e); }
        }

        function saveGameState(showNotice = false) {
            try {
                localStorage.setItem('dental_clinic_save_v2', JSON.stringify(gameState));
                if (showNotice) {
                    const indicator = document.getElementById('save-indicator');
                    if (indicator) {
                        indicator.classList.remove('hidden');
                        setTimeout(() => indicator.classList.add('hidden'), 2000);
                    }
                }
            } catch(e) {}
        }

        // --- Chairs Setup ---
        const chairsData = [
            { id: 1, name: "診察台 #1", xPos: -6, occupied: true, patient: { ...humanPatients[0] } },
            { id: 2, name: "診察台 #2", xPos: -1, occupied: false, patient: null },
            { id: 3, name: "診察台 #3", xPos: 4, occupied: false, patient: null },
            { id: 4, name: "診察台 #4", xPos: 9, occupied: false, patient: null },
            { id: 5, name: "診察台 #5", xPos: 14, occupied: false, patient: null }
        ];

        // --- Three.js Globals ---
        let scene, camera, renderer;
        let doctorMesh;
        let doctorTargetPos = { x: 0, z: 2 };
        let patientMeshes = {};
        let staffMeshes = [];
        let receptionStaffMesh = null;

        // Camera Control Variables
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngle = 0;
        let cameraRadius = 16;
        let cameraHeight = 11;

        // Player Movement Controls
        const keysPressed = {};

        // Treatment State
        let isTreating = false;

        // Initialize Application on Window Load
        window.onload = function() {
            loadGameState();
            init3DScene();
            renderChairSelectors();
            updateUI();
            setupControls();

            // Auto Save Interval continuously every 1s
            setInterval(() => saveGameState(false), 1000);

            // Animation Loop
            animate();
        };

        // --- 3D Scene Initialization ---
        function init3DScene() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            updateCameraPosition();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 15);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Floor
            const floorGeo = new THREE.PlaneGeometry(36, 20);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Walls
            const backWallGeo = new THREE.BoxGeometry(36, 6, 0.5);
            const backWallMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
            const backWall = new THREE.Mesh(backWallGeo, backWallMat);
            backWall.position.set(0, 3, -10);
            scene.add(backWall);

            // Entrance Door (IN & OUT)
            createDoor(-14, "出入口 (IN & OUT)", 0x10b981);

            // Reception Desk
            createReceptionDesk();

            // Create Dental Chairs & Patients (初期購入数分のみ生成)
            chairsData.forEach((chair, index) => {
                if (index < gameState.purchasedChairsCount) {
                    if (!chair.patient && humanPatients[index]) {
                        chair.patient = { ...humanPatients[index] };
                        chair.occupied = true;
                    }
                    createDentalChair(chair);
                }
            });

            // Create Doctor Mesh
            createDoctor();

            // Create Staff
            updateStaffMeshes();

            window.addEventListener('resize', onWindowResize);
        }

        function createDoor(x, labelText, colorHex) {
            const doorGeo = new THREE.BoxGeometry(2.5, 4.5, 0.2);
            const doorMat = new THREE.MeshStandardMaterial({ color: colorHex, transparent: true, opacity: 0.8 });
            const door = new THREE.Mesh(doorGeo, doorMat);
            door.position.set(x, 2.25, -9.8);
            scene.add(door);
        }

        function createReceptionDesk() {
            const deskGeo = new THREE.BoxGeometry(4, 1.2, 1.5);
            const deskMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 });
            const desk = new THREE.Mesh(deskGeo, deskMat);
            desk.position.set(-9, 0.6, -6);
            scene.add(desk);
        }

        function createDentalChair(chair) {
            const group = new THREE.Group();
            group.position.set(chair.xPos, 0, -3);

            // Chair Base
            const baseGeo = new THREE.BoxGeometry(1.6, 0.5, 2.8);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0.25;
            group.add(base);

            // Chair Backrest
            const backGeo = new THREE.BoxGeometry(1.5, 1.2, 0.3);
            const backMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 });
            const back = new THREE.Mesh(backGeo, backMat);
            back.position.set(0, 0.8, -1.2);
            group.add(back);

            scene.add(group);

            // Create Human Patient Mesh lying on Chair
            createHumanPatient(chair);
        }

        function createHumanPatient(chair) {
            if (patientMeshes[chair.id]) {
                scene.remove(patientMeshes[chair.id]);
            }

            const group = new THREE.Group();
            group.position.set(chair.xPos, 0.65, -3);

            // Body (Lying down)
            const bodyGeo = new THREE.CylinderGeometry(0.35, 0.35, 1.4, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x64748b });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.rotation.x = Math.PI / 2;
            group.add(body);

            // Head
            const headGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xfde047 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.set(0, 0.15, -0.8);
            group.add(head);

            patientMeshes[chair.id] = group;
            scene.add(group);
        }

        function createDoctor() {
            const group = new THREE.Group();

            // Body
            const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.5, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x10b981 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.75;
            group.add(body);

            // Head
            const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffedd5 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.75;
            group.add(head);

            group.position.set(0, 0, 2);
            doctorMesh = group;
            scene.add(doctorMesh);
        }

        function updateStaffMeshes() {
            // Clear existing staff
            staffMeshes.forEach(s => scene.remove(s));
            staffMeshes = [];

            if (receptionStaffMesh) {
                scene.remove(receptionStaffMesh);
                receptionStaffMesh = null;
            }

            // Reception Staff (Initially 1 present at reception desk)
            if (gameState.receptionStaffCount > 0) {
                const rGroup = new THREE.Group();
                const rBody = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 1.4, 8), new THREE.MeshStandardMaterial({ color: 0xf43f5e }));
                rBody.position.y = 0.7;
                rGroup.add(rBody);
                const rHead = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffedd5 }));
                rHead.position.y = 1.6;
                rGroup.add(rHead);

                rGroup.position.set(-9, 0, -4.5); // 受付カウンターの後ろ
                scene.add(rGroup);
                receptionStaffMesh = rGroup;
            }

            // Treatment Staff (Patrolling near chairs)
            for (let i = 0; i < gameState.doctorStaffCount; i++) {
                const group = new THREE.Group();
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 1.4, 8), new THREE.MeshStandardMaterial({ color: 0x14b8a6 }));
                body.position.y = 0.7;
                group.add(body);
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffedd5 }));
                head.position.y = 1.6;
                group.add(head);

                group.position.set(-1 + (i * 4), 0, -1);
                scene.add(group);
                staffMeshes.push(group);
            }
        }

        // --- Controls (Mouse & Touch Camera Rotation & Zoom) ---
        function setupControls() {
            const container = document.getElementById('canvas-container');

            container.addEventListener('pointerdown', (e) => {
                // 右クリック(button 2)または左クリック対応
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousMousePosition.x;
                // 右クリック等のドラッグ方向とカメラ旋回方向を直感的な方向に反転（+deltaX）
                cameraAngle -= deltaX * 0.005;
                updateCameraPosition();
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointerup', () => isDragging = false);

            container.addEventListener('wheel', (e) => {
                cameraRadius = Math.max(8, Math.min(30, cameraRadius + e.deltaY * 0.01));
                updateCameraPosition();
            });

            // Keyboard Movement (WASD & Arrows) & E-Key Shortcut & Shift Lock Toggle
            window.addEventListener('keydown', (e) => {
                keysPressed[e.key.toLowerCase()] = true;

                if (e.key === 'Shift') {
                    toggleShiftLock();
                }

                const activeChair = chairsData.find(c => c.id === gameState.activeChairId);
                if (e.key === 'e' || e.key === 'E') {
                    if (isDoctorNearChair(activeChair)) {
                        startSingleTreatment();
                    }
                }
            });

            window.addEventListener('keyup', (e) => {
                keysPressed[e.key.toLowerCase()] = false;
            });
        }

        function updateCameraPosition() {
            // ドクターの現在位置を中心にしてカメラを追従させる
            const targetX = doctorMesh ? doctorMesh.position.x : 0;
            const targetZ = doctorMesh ? doctorMesh.position.z : 0;

            camera.position.x = targetX + Math.sin(cameraAngle) * cameraRadius;
            camera.position.z = targetZ + Math.cos(cameraAngle) * cameraRadius;
            camera.position.y = cameraHeight;
            camera.lookAt(targetX, 0, targetZ);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Check distance between Doctor and target chair
        function isDoctorNearChair(chair) {
            if (!doctorMesh || !chair) return false;
            const dx = doctorMesh.position.x - chair.xPos;
            const dz = doctorMesh.position.z - (-3);
            const dist = Math.sqrt(dx * dx + dz * dz);
            return dist <= 3.5;
        }

        // --- Game Logic Actions ---
        function selectChair(id) {
            const chair = chairsData.find(c => c.id === id);
            if (!chair || id > gameState.purchasedChairsCount) return;
            
            gameState.activeChairId = id;
            if (chair) {
                doctorTargetPos.x = chair.xPos;
                doctorTargetPos.z = -0.5;
            }
            renderChairSelectors();
            updateUI();
        }

        function buyNewChair() {
            const cost = 50000;
            if (gameState.money >= cost && gameState.purchasedChairsCount < chairsData.length) {
                gameState.money -= cost;
                gameState.purchasedChairsCount++;
                
                // 新しく解放されたチェアーを生成
                const newChair = chairsData[gameState.purchasedChairsCount - 1];
                if (newChair) {
                    const randomPatient = humanPatients[Math.floor(Math.random() * humanPatients.length)];
                    newChair.patient = { ...randomPatient };
                    newChair.occupied = true;
                    createDentalChair(newChair);
                }

                saveGameState(true);
                renderChairSelectors();
                updateUI();
            }
        }

        function hireStaff(type) {
            const cost = 40000;
            if (gameState.money >= cost) {
                gameState.money -= cost;
                gameState.doctorStaffCount++;
                updateStaffMeshes();
                saveGameState(true);
                updateUI();
            }
        }

        function startSingleTreatment() {
            if (isTreating) return;
            const activeChair = chairsData.find(c => c.id === gameState.activeChairId);
            if (!activeChair || !activeChair.occupied) return;

            isTreating = true;
            const progressContainer = document.getElementById('treatment-progress-container');
            const progressBar = document.getElementById('treatment-progress-bar');
            const progressText = document.getElementById('treatment-progress-text');
            const btnTreat = document.getElementById('btn-treat-action');

            progressContainer.classList.remove('hidden');
            btnTreat.classList.add('hidden');

            let progress = 0;
            const interval = setInterval(() => {
                progress += 10;
                progressBar.style.width = progress + '%';
                progressText.innerText = progress + '%';

                if (progress >= 100) {
                    clearInterval(interval);
                    isTreating = false;
                    progressContainer.classList.add('hidden');

                    // Treatment Completion
                    const reward = activeChair.patient.reward;
                    gameState.money += reward;
                    gameState.reputation = Math.min(5.0, (parseFloat(gameState.reputation) + 0.1)).toFixed(1);

                    openModal(
                        `<i class="fa-solid fa-circle-check text-emerald-400 text-3xl"></i><br>治療完了！`,
                        `<p class="font-bold text-white text-sm mb-1">${activeChair.patient.name}</p>` +
                        `<p class="text-amber-300 font-bold mb-2">獲得報酬: +¥${reward.toLocaleString()}</p>` +
                        `<p class="italic bg-slate-800/80 p-2.5 rounded-xl border border-slate-700">"${activeChair.patient.feedback}"</p>`
                    );

                    // Patient exits to entrance door and a new patient arrives
                    respawnPatient(activeChair);
                    saveGameState(true);
                    updateUI();
                }
            }, 150);
        }

        function respawnPatient(chair) {
            const pMesh = patientMeshes[chair.id];
            if (!pMesh) return;

            // Animate exit to Entrance Door (-14, -9.8)
            let step = 0;
            const exitInterval = setInterval(() => {
                step++;
                pMesh.position.x += (-14 - pMesh.position.x) * 0.15;
                pMesh.position.z += (-9.8 - pMesh.position.z) * 0.15;

                if (step >= 20) {
                    clearInterval(exitInterval);
                    // Select new random human patient
                    const randomPatient = humanPatients[Math.floor(Math.random() * humanPatients.length)];
                    chair.patient = { ...randomPatient };
                    createHumanPatient(chair);
                    updateUI();
                }
            }, 50);
        }

        // UI Refresh
        function updateUI() {
            document.getElementById('ui-money').innerText = `¥${gameState.money.toLocaleString()}`;
            document.getElementById('ui-reputation').innerText = gameState.reputation;
            document.getElementById('ui-doctor-staff-count').innerText = gameState.doctorStaffCount;

            const activeChair = chairsData.find(c => c.id === gameState.activeChairId) || chairsData[0];
            if (activeChair && activeChair.patient) {
                document.getElementById('patient-icon').innerText = activeChair.patient.icon;
                document.getElementById('patient-name').innerText = activeChair.patient.name;
                document.getElementById('patient-symptom').innerText = activeChair.patient.symptom;
                document.getElementById('chair-badge').innerText = `台 #${activeChair.id}`;
            }

            const isNear = isDoctorNearChair(activeChair);
            const distAlert = document.getElementById('distance-alert');
            const btnTreat = document.getElementById('btn-treat-action');

            if (!isTreating) {
                if (isNear) {
                    distAlert.classList.add('hidden');
                    btnTreat.classList.remove('hidden');
                } else {
                    distAlert.classList.remove('hidden');
                    btnTreat.classList.add('hidden');
                }
            }

            // Chair Buy Button logic
            const buyBtn = document.getElementById('btn-buy-chair');
            if (gameState.purchasedChairsCount >= chairsData.length) {
                buyBtn.style.display = 'none';
            } else {
                buyBtn.style.display = 'flex';
            }
        }

        function renderChairSelectors() {
            const container = document.getElementById('chair-selector-list');
            container.innerHTML = '';

            // 現在購入されている数（purchasedChairsCount）のみ生成
            for (let i = 0; i < gameState.purchasedChairsCount; i++) {
                const chair = chairsData[i];
                if (!chair) continue;
                const isActive = chair.id === gameState.activeChairId;

                const btn = document.createElement('button');
                btn.className = `glass-panel text-xs font-bold p-2.5 rounded-2xl flex items-center justify-between gap-3 border transition btn-action ${
                    isActive ? 'border-cyan-400 bg-cyan-500/20 text-cyan-300' : 'border-slate-700 hover:bg-slate-800 text-slate-300'
                }`;
                btn.onclick = () => selectChair(chair.id);
                btn.innerHTML = `
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-chair text-sm"></i>
                        <span>${chair.name}</span>
                    </div>
                    <span class="w-2 h-2 rounded-full ${chair.occupied ? 'bg-emerald-400 animate-pulse' : 'bg-slate-600'}"></span>
                `;
                container.appendChild(btn);
            }
        }

        // --- Main Animation & Player Movement Loop ---
        function animate() {
            requestAnimationFrame(animate);

            // Player Movement Logic (WASD & Arrow Keys)
            let speed = isShiftLocked ? 0.22 : 0.12;
            let moveX = 0;
            let moveZ = 0;

            if (keysPressed['w'] || keysPressed['arrowup']) moveZ -= speed;
            if (keysPressed['s'] || keysPressed['arrowdown']) moveZ += speed;
            if (keysPressed['a'] || keysPressed['arrowleft']) moveX -= speed;
            if (keysPressed['d'] || keysPressed['arrowright']) moveX += speed;

            if (doctorMesh && (moveX !== 0 || moveZ !== 0)) {
                // 移動可能範囲の制限（壁の中に入らないようにする）
                doctorMesh.position.x = Math.max(-16, Math.min(16, doctorMesh.position.x + moveX));
                doctorMesh.position.z = Math.max(-8, Math.min(8, doctorMesh.position.z + moveZ));
                // 注意: 進行方向への体の回転・旋回は行わず一定方向を維持します
            }

            // ドクターの位置にカメラを毎フレームスムーズに追従
            updateCameraPosition();

            // UIの距離インジケーター表示更新
            updateUI();

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
