<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勇者の世界ガチャ - 3Dオープンワールド</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            background-color: #120919;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .gacha-box {
            background: rgba(20, 10, 28, 0.7);
            border: 1px solid rgba(217, 119, 6, 0.3);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
        #threejs-canvas-holder canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            border-radius: 0.75rem;
        }
        /* Magic Circle Rotation Animation */
        @keyframes spin-seal {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-spin-seal {
            animation: spin-seal 12s linear infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 md:p-6 bg-[#120919] text-gray-100 select-none">

    <!-- Header Section -->
    <header class="max-w-4xl w-full mx-auto mb-3">
        <!-- Top Title Bar -->
        <div class="flex items-center justify-between mb-3">
            <button class="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center border border-amber-500/40 shadow">
                <i class="fa-solid fa-bars text-sm"></i>
            </button>
            
            <div class="text-center flex flex-col items-center">
                <h1 class="text-xl md:text-3xl font-black text-amber-300 tracking-wider flex items-center gap-2 drop-shadow-md">
                    <i class="fa-solid fa-shield-halved text-amber-400"></i> 勇者の世界ガチャ <i class="fa-solid fa-shield-halved text-amber-400"></i>
                </h1>
                <p class="text-[11px] text-amber-200/70 mt-0.5 font-semibold">✨ 自由な配置で世界をデザインしよう！ ✨</p>
            </div>

            <div class="flex items-center gap-1.5">
                <button onclick="addSpinsAction()" class="px-2.5 py-1 rounded-xl bg-amber-500 text-gray-950 text-[11px] font-black flex items-center gap-1 shadow hover:bg-amber-400">
                    <i class="fa-solid fa-plus text-xs"></i> 招集を追加
                </button>
                <button onclick="toggleAudio()" class="w-7 h-7 rounded-lg bg-gray-900/80 text-gray-300 flex items-center justify-center border border-gray-700/80">
                    <i id="bgm-icon" class="fa-solid fa-volume-xmark text-xs"></i>
                </button>
                <button onclick="openGenericModal('modal-updates')" class="w-7 h-7 rounded-lg bg-gray-900/80 text-gray-300 flex items-center justify-center border border-gray-700/80">
                    <i class="fa-solid fa-gear text-xs"></i>
                </button>
            </div>
        </div>

        <!-- Upper Status Card -->
        <div class="gacha-box rounded-2xl p-3 border border-amber-500/30 flex flex-col gap-2">
            <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
                <div class="flex items-center gap-2">
                    <span class="bg-amber-950/80 text-amber-300 px-3 py-1 rounded-xl border border-amber-500/40 font-bold flex items-center gap-1">
                        ✨ 召喚可能: <strong id="stat-spins" class="text-white text-sm">100</strong> 回
                    </span>
                    <button onclick="addSpinsAction()" class="bg-amber-500 hover:bg-amber-400 text-gray-950 font-black text-[11px] px-2.5 py-1 rounded-xl transition shadow">
                        本日の限界突破 (+50回)
                    </button>
                    <button onclick="openGenericModal('modal-updates')" class="bg-purple-600 hover:bg-purple-500 text-white font-bold text-[11px] px-2.5 py-1 rounded-xl transition shadow">
                        告知を読む
                    </button>
                </div>
                <div class="bg-purple-950/80 text-purple-200 px-3 py-1 rounded-xl border border-purple-500/40 font-bold text-xs">
                    ⚡ 勇者EXP: <strong id="stat-exp" class="text-white text-sm">0</strong>
                </div>
            </div>

            <!-- Equipped Weapon Display -->
            <div class="bg-black/60 p-2 rounded-xl border border-gray-800 flex items-center justify-between shadow-inner">
                <span class="text-xs text-amber-200 font-medium flex items-center gap-1.5">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i>
                    装備中の武器: <strong id="equipped-weapon-name" class="text-white font-bold">素手 (攻撃力: 10)</strong>
                </span>
                <button onclick="pullGacha(1)" class="bg-amber-500 hover:bg-amber-400 text-gray-950 text-xs font-black px-3 py-1 rounded-lg shadow">
                    ガチャを引く
                </button>
            </div>

            <!-- Stats Row -->
            <div class="flex items-center justify-between text-[11px] text-gray-400 px-1 font-medium">
                <span>💎 竜のダイヤ: <strong id="stat-diamonds" class="text-cyan-400 font-bold">0</strong> 個</span>
                <span>通算召喚数: <strong id="stat-total-pulls" class="text-purple-300 font-bold">0</strong> 回</span>
                <span>本日の残り上限: <strong id="stat-daily-limit" class="text-amber-300 font-bold">0/500</strong> 回</span>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-4xl w-full mx-auto grid grid-cols-1 md:grid-cols-2 gap-4 my-auto items-stretch">
        
        <!-- Left Column Buttons -->
        <section class="flex flex-col justify-between gap-2.5">
            <!-- Green Main 3D Button with Earth Emoji -->
            <button onclick="openWorldAdventure()" class="w-full py-3 px-4 bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-black text-base rounded-2xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2 border border-emerald-300">
                <span class="text-xl">🌍</span>
                広大な世界へ冒険に出かける！(3D)
            </button>

            <!-- Gacha Pull Row -->
            <div class="grid grid-cols-3 gap-2">
                <button onclick="pullGacha(1)" class="py-2.5 bg-amber-400 hover:bg-amber-300 text-gray-950 font-black rounded-xl text-xs shadow transition active:scale-95">
                    召喚 (1連)
                </button>
                <button onclick="pullGacha(10)" class="py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-xl text-xs shadow transition active:scale-95">
                    ✨ 10連召喚
                </button>
                <button onclick="pullGacha(100)" class="py-2.5 bg-gradient-to-r from-rose-500 to-amber-500 hover:from-rose-400 hover:to-amber-400 text-white font-black rounded-xl text-xs shadow transition active:scale-95">
                    ⚡ 神速100連!
                </button>
            </div>

            <!-- Action Buttons Grid -->
            <div class="grid grid-cols-2 gap-2">
                <button onclick="openGenericModal('modal-stats')" class="py-2 bg-indigo-950/80 hover:bg-indigo-900 border border-indigo-700/50 text-indigo-200 text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 shadow">
                    <i class="fa-solid fa-box text-amber-400"></i> 所持装備・道具
                </button>
                <button onclick="openGenericModal('modal-updates')" class="py-2 bg-emerald-950/80 hover:bg-emerald-900 border border-emerald-700/50 text-emerald-200 text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 shadow">
                    <i class="fa-solid fa-leaf text-emerald-400"></i> 王国の告知
                </button>
                <button onclick="openGenericModal('modal-local')" class="py-2 bg-amber-950/80 hover:bg-amber-900 border border-amber-700/50 text-amber-200 text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 shadow">
                    <i class="fa-solid fa-house-chimney text-amber-400"></i> ダンジョン召喚
                </button>
                <button onclick="openGenericModal('modal-tasks')" class="py-2 bg-amber-950/80 hover:bg-amber-900 border border-amber-700/50 text-amber-200 text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 shadow">
                    <i class="fa-solid fa-book text-amber-400"></i> 勇者クエスト
                </button>
                <button onclick="openGenericModal('modal-trade')" class="py-2 bg-teal-950/80 hover:bg-teal-900 border border-teal-700/50 text-teal-200 text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 shadow">
                    <i class="fa-solid fa-handshake text-teal-400"></i> 錬金交易所
                </button>
                <button onclick="openGenericModal('modal-live')" class="py-2 bg-purple-950/80 hover:bg-purple-900 border border-purple-700/50 text-purple-200 text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 shadow">
                    <i class="fa-solid fa-music text-purple-400"></i> 冒険のBGM
                </button>
            </div>

            <!-- Live Banner Button -->
            <button onclick="openGenericModal('modal-live')" class="w-full py-2 bg-purple-950/80 hover:bg-purple-900 border border-purple-800/50 text-pink-300 text-xs font-bold rounded-xl flex items-center justify-center gap-2 shadow">
                <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
                ⛩️ 魔王城中継（ライブ）
            </button>
        </section>

        <!-- Right Column Gacha Machine Area -->
        <section class="flex flex-col items-center justify-center h-full">
            <div class="w-full max-w-[320px] h-[480px] bg-gradient-to-b from-[#d97706] via-[#b45309] to-[#78350f] rounded-[42px] p-5 border-2 border-amber-400/80 flex flex-col items-center justify-between shadow-2xl relative overflow-hidden">
                <!-- Inner Circular Glass Display -->
                <div class="w-60 h-60 rounded-full bg-[#120919] border-4 border-[#2d1b3d] flex items-center justify-center relative my-auto shadow-inner overflow-hidden">
                    <!-- Magic Seal -->
                    <div class="absolute w-44 h-44 border border-purple-500/30 flex items-center justify-center animate-spin-seal">
                        <div class="w-32 h-32 border border-amber-500/30 rotate-45"></div>
                    </div>
                    <div class="absolute w-52 h-52 rounded-full border border-purple-400/20"></div>

                    <!-- Glowing Spheres -->
                    <div class="flex items-center gap-3 z-10">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-rose-400 via-rose-600 to-rose-900 shadow-[0_0_15px_rgba(244,63,94,0.8)] border border-rose-300"></div>
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-cyan-300 via-blue-600 to-blue-900 shadow-[0_0_15px_rgba(59,130,246,0.8)] border border-cyan-200"></div>
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-300 via-purple-600 to-purple-900 shadow-[0_0_15px_rgba(168,85,247,0.8)] border border-purple-200"></div>
                    </div>
                </div>

                <!-- Lower Controls & Exit Chute -->
                <div class="w-full flex flex-col items-center gap-4 mb-2">
                    <!-- Turn Handle -->
                    <div onclick="pullGacha(1)" class="w-32 h-11 bg-gradient-to-b from-amber-300 to-amber-500 hover:from-amber-200 hover:to-amber-400 rounded-full border-2 border-amber-200 flex items-center justify-center gap-4 shadow-lg cursor-pointer transition active:scale-95">
                        <div class="w-3.5 h-3.5 rounded-full bg-[#78350f] border border-amber-200 shadow-inner"></div>
                        <div class="w-3.5 h-3.5 rounded-full bg-[#78350f] border border-amber-200 shadow-inner"></div>
                    </div>

                    <!-- Capsule Outlet -->
                    <div class="w-28 h-12 bg-[#0d0714] rounded-t-3xl border-t-2 border-x-2 border-amber-900/60 flex items-center justify-center shadow-inner">
                        <div class="w-20 h-3 bg-black/80 rounded-full shadow-inner"></div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="max-w-5xl w-full mx-auto text-center mt-6 text-xs text-gray-500">
        © 2026 勇者の世界ガチャ - All rights reserved.
    </footer>

    <!-- Modal Dialog (Generic) -->
    <div id="generic-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-700 rounded-2xl p-6 max-w-md w-full shadow-2xl relative">
            <h3 id="modal-title" class="text-lg font-bold text-amber-400 mb-2">タイトル</h3>
            <p id="modal-body" class="text-sm text-gray-300 whitespace-pre-line mb-6">内容</p>
            <button onclick="closeGenericModal()" class="w-full py-2.5 bg-gray-800 hover:bg-gray-700 text-white font-semibold rounded-xl transition">
                閉じる
            </button>
        </div>
    </div>

    <!-- 3D Open World Modal -->
    <div id="world-3d-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden z-50 flex flex-col items-center justify-center p-2 md:p-4">
        <div class="bg-gray-900/90 border border-amber-500/50 rounded-2xl p-3 md:p-4 max-w-2xl w-full flex flex-col gap-2 shadow-2xl relative">
            
            <!-- Header Title -->
            <div class="text-center py-1">
                <h3 class="text-lg font-bold text-amber-300 flex items-center justify-center gap-2">
                    🌍 3Dオープンワールド冒険モード
                </h3>
            </div>

            <!-- Top Status Bar -->
            <div class="flex items-center justify-between text-xs font-bold bg-amber-950/60 border border-amber-500/40 rounded-xl px-3 py-1.5 text-amber-200">
                <span>🗡️ 装備: <span id="3d-weapon-name" class="text-white">素手</span></span>
                <span>💥 攻撃力: <span id="3d-weapon-atk" class="text-rose-400">10</span></span>
                <span>📍 場所: <span class="text-amber-300">冒険の始まりの街</span></span>
            </div>

            <!-- 3D Viewport Holder -->
            <div id="threejs-canvas-holder" class="w-full h-[360px] md:h-[400px] bg-black rounded-xl relative overflow-hidden border border-amber-500/30">
                <div class="absolute top-3 left-3 bg-rose-950/80 border border-rose-500/60 px-3 py-1 rounded-full text-[11px] font-bold text-rose-200 z-10 flex items-center gap-1.5 shadow">
                    <span>😈 魔王HP:</span>
                    <span id="boss-hp" class="text-rose-400 text-xs font-black">10000</span>
                </div>
                <div class="absolute top-3 right-3 bg-cyan-950/80 border border-cyan-500/60 px-3 py-1 rounded-full text-[11px] font-bold text-cyan-200 z-10 flex items-center gap-1.5 shadow">
                    <span>🖱️ 右クリックドラッグ: 360度視点</span>
                </div>

                <!-- Touch Joystick Area -->
                <div id="joystick-zone" class="absolute bottom-4 left-4 w-24 h-24 rounded-full bg-white/10 border border-white/20 z-10 flex items-center justify-center touch-none">
                    <div id="joystick-knob" class="w-10 h-10 rounded-full bg-amber-400/80 border border-white shadow"></div>
                </div>
            </div>

            <!-- Bottom Controls -->
            <div class="flex items-center justify-between gap-2 mt-1">
                <p class="text-[11px] text-gray-400 font-medium">【操作】[WASD] / 方向キー / 画面左下ドラッグで移動</p>
                <button onclick="close3DWorld()" class="px-4 py-1.5 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs rounded-xl shadow">
                    冒険を中断して戻る
                </button>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        // --- GAME STATE ---
        const gameState = {
            spins: 100,
            diamonds: 0,
            exp: 0,
            totalPulls: 0,
            dailyLimit: 500,
            inventory: [
                { id: 'w_fist', name: '素手', atk: 10, type: 'weapon' }
            ],
            equippedWeapon: { id: 'w_fist', name: '素手', atk: 10, type: 'weapon' }
        };

        const weaponDatabase = [
            { id: 'w_bronze', name: '銅の剣', atk: 35 },
            { id: 'w_iron', name: '鉄の長剣', atk: 80 },
            { id: 'w_silver', name: '銀のレイピア', atk: 180 },
            { id: 'w_gold', name: '黄金の大剣', atk: 450 },
            { id: 'w_hero', name: '伝説の勇者ロトの剣', atk: 1200 },
            { id: 'w_god', name: '神威・天叢雲剣', atk: 5000 }
        ];

        // --- LOCAL STORAGE LOGIC ---
        function loadState() {
            try {
                const saved = localStorage.getItem('hero_world_gacha_save');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    Object.assign(gameState, parsed);
                }
            } catch(e) { console.error(e); }
            updateUI();
        }

        function saveState() {
            try {
                localStorage.setItem('hero_world_gacha_save', JSON.stringify(gameState));
            } catch(e) { console.error(e); }
        }

        function updateUI() {
            document.getElementById('stat-spins').innerText = gameState.spins;
            document.getElementById('stat-diamonds').innerText = gameState.diamonds;
            document.getElementById('stat-exp').innerText = gameState.exp;
            document.getElementById('stat-total-pulls').innerText = gameState.totalPulls;
            document.getElementById('stat-daily-limit').innerText = `${gameState.totalPulls % 500}/500`;
            document.getElementById('equipped-weapon-name').innerText = `${gameState.equippedWeapon.name} (攻撃力: ${gameState.equippedWeapon.atk})`;
        }

        // --- GACHA ACTIONS ---
        function pullGacha(count) {
            if (gameState.spins < count) {
                openModal('召喚回数が不足しています', '「本日の限界突破 (+50回)」ボタンを押して召喚回数を補充してください！');
                return;
            }

            gameState.spins -= count;
            gameState.totalPulls += count;
            gameState.exp += count * 15;
            gameState.diamonds += count * 2;

            let bestWeaponGot = null;

            for (let i = 0; i < count; i++) {
                const rand = Math.random() * 100;
                let weapon = null;
                if (rand < 0.5) weapon = weaponDatabase[5];
                else if (rand < 3) weapon = weaponDatabase[4];
                else if (rand < 10) weapon = weaponDatabase[3];
                else if (rand < 25) weapon = weaponDatabase[2];
                else if (rand < 50) weapon = weaponDatabase[1];
                else if (rand < 85) weapon = weaponDatabase[0];

                if (weapon) {
                    if (!gameState.inventory.some(item => item.id === weapon.id)) {
                        gameState.inventory.push({ ...weapon, type: 'weapon' });
                    }
                    if (!bestWeaponGot || weapon.atk > bestWeaponGot.atk) {
                        bestWeaponGot = weapon;
                    }
                }
            }

            if (bestWeaponGot && bestWeaponGot.atk > gameState.equippedWeapon.atk) {
                gameState.equippedWeapon = { ...bestWeaponGot, type: 'weapon' };
            }

            saveState();
            updateUI();

            if (count === 1) {
                openModal('✨ 召喚結果', bestWeaponGot ? `【獲得！】 ${bestWeaponGot.name} (攻撃力: ${bestWeaponGot.atk})` : '薬草を入手しました！');
            } else {
                openModal(`✨ ${count}連 召喚完了！`, `竜のダイヤ +${count * 2}個\n勇者EXP +${count * 15}\n最高獲得装備: ${bestWeaponGot ? bestWeaponGot.name : 'なし'}`);
            }
        }

        function addSpinsAction() {
            gameState.spins += 50;
            saveState();
            updateUI();
            openModal('限界突破成功！', '召喚可能回数が +50 回加算されました！');
        }

        function toggleAudio() {
            const icon = document.getElementById('bgm-icon');
            if (icon) {
                if (icon.classList.contains('fa-volume-xmark')) {
                    icon.className = 'fa-solid fa-volume-high text-xs text-amber-400';
                } else {
                    icon.className = 'fa-solid fa-volume-xmark text-xs text-gray-300';
                }
            }
        }

        // --- MODAL CONTROLS ---
        function openModal(title, bodyText) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerText = bodyText;
            document.getElementById('generic-modal').classList.remove('hidden');
        }

        function closeGenericModal() {
            document.getElementById('generic-modal').classList.add('hidden');
        }

        const actionMap = {
            'modal-stats': () => {
                const items = gameState.inventory.map(i => `・${i.name} (攻撃力: ${i.atk})`).join('\n');
                openModal('🎒 所持装備・道具一覧', items || '所持している装備はありません。');
            },
            'modal-updates': () => openModal('王国の告知', '【アップデート】3Dオープンワールド機能と右クリックドラッグでの360度カメラ回転操作が追加されました！'),
            'modal-local': () => openModal('ダンジョン召喚', '近くのダンジョンから強敵が呼び出されます！準備を整えて冒険へ出かけましょう。'),
            'modal-tasks': () => openModal('勇者クエスト', '1. ガチャを10回引く (達成!)\n2. 3D世界で魔王に攻撃する\n3. 装備を強化する'),
            'modal-trade': () => openModal('錬金交易所', '不要な装備を錬金して「竜のダイヤ」に変換できます。'),
            'modal-live': () => openModal('魔王城中継（ライブ）', '🔴 LIVE: 魔王城周辺は本日も静寂に包まれています...')
        };

        function openGenericModal(type) {
            if (actionMap[type]) actionMap[type]();
        }

        // --- 3D OPEN WORLD (THREE.JS) ---
        let threeScene, threeCamera, threeRenderer, heroMesh, bossMesh;
        let animationFrameId = null;
        let bossHp = 10000;

        const battleState = {
            keys: { Up: false, Down: false, Left: false, Right: false },
            hero: { x: 0, z: 15 }
        };

        function openWorldAdventure() {
            document.getElementById('world-3d-modal').classList.remove('hidden');
            document.getElementById('3d-weapon-name').innerText = gameState.equippedWeapon.name;
            document.getElementById('3d-weapon-atk').innerText = gameState.equippedWeapon.atk;
            setTimeout(() => {
                init3DWorld();
            }, 100);
        }

        function close3DWorld() {
            document.getElementById('world-3d-modal').classList.add('hidden');
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
        }

        function init3DWorld() {
            const holder = document.getElementById('threejs-canvas-holder');
            if (!holder) return;
            holder.innerHTML = '';

            const width = holder.clientWidth || 600;
            const height = holder.clientHeight || 400;

            threeScene = new THREE.Scene();
            threeScene.background = new THREE.Color(0x0a1128);
            threeScene.fog = new THREE.FogExp2(0x0a1128, 0.005);

            threeCamera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
            threeCamera.position.set(0, 12, 30);

            threeRenderer = new THREE.WebGLRenderer({ antialias: true });
            threeRenderer.setSize(width, height);
            threeRenderer.shadowMap.enabled = true;
            holder.appendChild(threeRenderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            threeScene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            threeScene.add(dirLight);

            // Ground & Grid
            const gridHelper = new THREE.GridHelper(500, 50, 0x00ffcc, 0x1d4ed8);
            gridHelper.position.y = 0.01;
            threeScene.add(gridHelper);

            const groundGeo = new THREE.PlaneGeometry(500, 500);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x15803d });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            threeScene.add(ground);

            // Hero Mesh
            heroMesh = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(1.2, 1.8, 0.8);
            const bodyMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.9;
            heroMesh.add(body);

            const headGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const headMat = new THREE.MeshLambertMaterial({ color: 0xf87171 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.1;
            heroMesh.add(head);

            const swordMesh = new THREE.Mesh(
                new THREE.BoxGeometry(0.2, 2.0, 0.2),
                new THREE.MeshLambertMaterial({ color: 0xf59e0b })
            );
            swordMesh.position.set(0.8, 1.2, 0.3);
            heroMesh.add(swordMesh);

            heroMesh.position.set(battleState.hero.x, 0, battleState.hero.z);
            threeScene.add(heroMesh);

            // Temple / Boss Area
            const templeGroup = new THREE.Group();
            const pillarGeo = new THREE.CylinderGeometry(0.8, 0.8, 8, 8);
            const pillarMat = new THREE.MeshLambertMaterial({ color: 0xfbbf24 });
            for (let i = -2; i <= 2; i += 4) {
                for (let j = -2; j <= 2; j += 4) {
                    const p = new THREE.Mesh(pillarGeo, pillarMat);
                    p.position.set(i * 3, 4, j * 3);
                    templeGroup.add(p);
                }
            }

            bossMesh = new THREE.Mesh(
                new THREE.ConeGeometry(2, 4, 6),
                new THREE.MeshLambertMaterial({ color: 0xd97706 })
            );
            bossMesh.position.set(0, 2, -10);
            templeGroup.add(bossMesh);
            threeScene.add(templeGroup);

            setupControls(holder);
            animate3D();
        }

        // Mouse Right-Click Drag for 360 Camera Orbit
        let isRightMouseDown = false;
        let prevCamX = 0, prevCamY = 0;

        function setupControls(container) {
            container.addEventListener('contextmenu', e => e.preventDefault());

            container.addEventListener('mousedown', (e) => {
                if (e.button === 2) { // Right Click
                    isRightMouseDown = true;
                    prevCamX = e.clientX;
                    prevCamY = e.clientY;
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (isRightMouseDown && heroMesh) {
                    const deltaX = e.clientX - prevCamX;
                    const deltaY = e.clientY - prevCamY;

                    heroMesh.rotation.y -= deltaX * 0.005;

                    if (threeCamera) {
                        threeCamera.position.y = Math.max(2, Math.min(25, threeCamera.position.y + deltaY * 0.05));
                    }

                    prevCamX = e.clientX;
                    prevCamY = e.clientY;
                }
            });

            window.addEventListener('mouseup', (e) => {
                if (e.button === 2) isRightMouseDown = false;
            });

            // Keyboard Navigation
            window.addEventListener('keydown', (e) => {
                if (e.key === 'w' || e.key === 'ArrowUp') battleState.keys.Up = true;
                if (e.key === 's' || e.key === 'ArrowDown') battleState.keys.Down = true;
                if (e.key === 'a' || e.key === 'ArrowLeft') battleState.keys.Left = true;
                if (e.key === 'd' || e.key === 'ArrowRight') battleState.keys.Right = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'w' || e.key === 'ArrowUp') battleState.keys.Up = false;
                if (e.key === 's' || e.key === 'ArrowDown') battleState.keys.Down = false;
                if (e.key === 'a' || e.key === 'ArrowLeft') battleState.keys.Left = false;
                if (e.key === 'd' || e.key === 'ArrowRight') battleState.keys.Right = false;
            });

            // Touch Joystick Logic
            setupTouchControls(container);
        }

        function setupTouchControls(container) {
            const joystickZone = document.getElementById('joystick-zone');
            const joystickKnob = document.getElementById('joystick-knob');
            let joystickTouchId = null;
            let joystickCenter = { x: 0, y: 0 };

            container.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    const rect = joystickZone.getBoundingClientRect();

                    if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                        touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                        joystickTouchId = touch.identifier;
                        joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                        updateJoystick(touch.clientX, touch.clientY);
                    }
                }
            }, { passive: true });

            container.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joystickTouchId) {
                        updateJoystick(touch.clientX, touch.clientY);
                    }
                }
            }, { passive: true });

            const resetTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joystickTouchId) {
                        joystickTouchId = null;
                        battleState.keys.Up = battleState.keys.Down = battleState.keys.Left = battleState.keys.Right = false;
                        if (joystickKnob) joystickKnob.style.transform = 'translate(0px, 0px)';
                    }
                }
            };

            container.addEventListener('touchend', resetTouch);
            container.addEventListener('touchcancel', resetTouch);

            function updateJoystick(clientX, clientY) {
                const dx = clientX - joystickCenter.x;
                const dy = clientY - joystickCenter.y;
                const dist = Math.hypot(dx, dy);
                const maxDist = 38;
                const angle = Math.atan2(dy, dx);
                const cappedDist = Math.min(dist, maxDist);

                const moveX = Math.cos(angle) * cappedDist;
                const moveY = Math.sin(angle) * cappedDist;

                if (joystickKnob) {
                    joystickKnob.style.transform = `translate(${moveX}px, ${moveY}px)`;
                }

                const threshold = 10;
                battleState.keys.Right = dx > threshold;
                battleState.keys.Left = dx < -threshold;
                battleState.keys.Down = dy > threshold;
                battleState.keys.Up = dy < -threshold;
            }
        }

        function animate3D() {
            animationFrameId = requestAnimationFrame(animate3D);

            const speed = 0.35;
            if (heroMesh) {
                if (battleState.keys.Up) heroMesh.translateZ(-speed);
                if (battleState.keys.Down) heroMesh.translateZ(speed);
                if (battleState.keys.Left) heroMesh.translateX(-speed);
                if (battleState.keys.Right) heroMesh.translateX(speed);

                // Smooth Camera Tracking
                const camOffset = new THREE.Vector3(0, 8, 18).applyQuaternion(heroMesh.quaternion);
                threeCamera.position.lerp(heroMesh.position.clone().add(camOffset), 0.1);
                threeCamera.lookAt(heroMesh.position.clone().add(new THREE.Vector3(0, 1.5, 0)));

                // Boss Collision Check
                if (bossMesh && heroMesh.position.distanceTo(bossMesh.position) < 3.5) {
                    bossHp = Math.max(0, bossHp - gameState.equippedWeapon.atk);
                    document.getElementById('boss-hp').innerText = bossHp;
                    if (bossHp === 0) {
                        bossHp = 10000;
                        gameState.diamonds += 100;
                        saveState();
                        updateUI();
                        openModal('🎉 魔王撃破！', '魔王を撃破しました！報酬として「竜のダイヤ +100個」を獲得！');
                    }
                }
            }

            if (bossMesh) bossMesh.rotation.y += 0.02;

            if (threeRenderer && threeScene && threeCamera) {
                threeRenderer.render(threeScene, threeCamera);
            }
        }

        // Initialize state on page load
        window.onload = function() {
            loadState();
        };
    </script>
</body>
</html>
