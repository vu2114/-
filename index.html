<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勇者の世界ガチャ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 0; }
        .ui-layer { position: relative; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        .glow-gold { box-shadow: 0 0 15px rgba(245, 158, 11, 0.5); }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans h-screen w-screen overflow-hidden">

    <!-- 3D Canvas Background -->
    <div id="canvas-container"></div>

    <!-- Main UI Layer -->
    <div class="ui-layer h-full flex flex-col justify-between p-4 sm:p-6">
        
        <!-- HEADER -->
        <header class="flex justify-between items-center w-full max-w-7xl mx-auto">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-r from-amber-500 to-yellow-300 p-2.5 rounded-2xl shadow-lg text-slate-950 flex items-center justify-center">
                    <i class="fa-solid font-bold text-xl">⚔️</i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold tracking-wide bg-gradient-to-r from-amber-300 via-yellow-400 to-amber-500 bg-clip-text text-transparent">
                        勇者の世界ガチャ
                    </h1>
                    <p class="text-xs text-slate-400">右クリックドラッグで視点操作</p>
                </div>
            </div>

            <div class="flex items-center gap-3 interactive">
                <!-- Free Add Button -->
                <button onclick="addFreeGacha(50)" class="bg-gradient-to-r from-amber-500 to-yellow-500 text-black font-extrabold px-3 py-1.5 rounded-full text-xs shadow-lg hover:brightness-110 active:scale-95 transition flex items-center gap-1 border border-yellow-200">
                    <i class="fa-solid fa-plus text-xs"></i> 招集を追加する
                </button>
                <!-- Audio Toggle Button -->
                <button onclick="toggleAudio()" class="w-8 h-8 rounded-full bg-purple-900/60 border border-purple-400/40 flex items-center justify-center text-purple-200 text-xs">
                    <i id="bgm-icon" class="fa-solid fa-volume-xmark"></i>
                </button>
                <!-- Settings Button -->
                <button onclick="openModal('settings')" class="w-8 h-8 rounded-full bg-slate-800/60 border border-slate-600/40 flex items-center justify-center text-slate-300 text-xs">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </header>

        <!-- FOOTER CONTROLS -->
        <div class="w-full max-w-md mx-auto mb-6 interactive">
            <div class="bg-slate-900/80 backdrop-blur-md p-4 rounded-3xl border border-slate-700/60 shadow-2xl flex flex-col gap-3">
                <div class="flex justify-between items-center px-2">
                    <span class="text-xs text-slate-400">所持ガチャ券</span>
                    <span id="gacha-count" class="text-lg font-black text-amber-400">100 枚</span>
                </div>
                <div class="flex gap-3">
                    <button onclick="drawGacha(1)" class="flex-1 py-3 rounded-2xl font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600/50 transition active:scale-95 text-sm">
                        1回引く
                    </button>
                    <button onclick="drawGacha(10)" class="flex-1 py-3 rounded-2xl font-black bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 shadow-lg hover:brightness-110 transition active:scale-95 text-sm glow-gold">
                        10連引く！
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- GACHA RESULT MODAL -->
    <div id="result-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center hidden interactive">
        <div class="bg-slate-900 border border-amber-500/40 p-6 rounded-3xl max-w-sm w-full mx-4 text-center shadow-2xl">
            <h2 class="text-xl font-bold text-amber-400 mb-4">召喚結果</h2>
            <div id="result-content" class="flex flex-wrap justify-center gap-2 max-h-60 overflow-y-auto mb-6 p-2">
                <!-- Items inserted dynamically -->
            </div>
            <button onclick="closeModal('result-modal')" class="w-full py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold hover:bg-amber-400 transition">
                確認
            </button>
        </div>
    </div>

    <!-- 3D & Logic Script -->
    <script>
        // --- 3D Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0f172a, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xf59e0b, 1.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // Objects
        const geometry = new THREE.IcosahedronGeometry(2, 1);
        const material = new THREE.MeshStandardMaterial({
            color: 0xf59e0b,
            roughness: 0.2,
            metalness: 0.8,
            wireframe: true
        });
        const orb = new THREE.Mesh(geometry, material);
        scene.add(orb);

        // Particles
        const particleGeo = new THREE.BufferGeometry();
        const count = 200;
        const posArray = new Float32Array(count * 3);
        for(let i=0; i<count*3; i++) {
            posArray[i] = (Math.random() - 0.5) * 20;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particleMat = new THREE.PointsMaterial({ size: 0.05, color: 0xfcb83b });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        camera.position.z = 6;

        // --- Camera Controls (Right Click Drag) ---
        let isRightDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => {
            if (e.button === 2) { // Right Click
                isRightDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!isRightDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            orb.rotation.y += deltaX * 0.008;
            orb.rotation.x += deltaY * 0.008;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 2) isRightDragging = false;
        });

        window.addEventListener('contextmenu', (e) => e.preventDefault());

        // Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            if (!isRightDragging) {
                orb.rotation.y += 0.003;
            }
            particles.rotation.y -= 0.001;
            renderer.render(scene, camera);
        }
        animate();

        // --- Game Logic ---
        let gachaCount = 100;
        const countEl = document.getElementById('gacha-count');

        function updateUI() {
            countEl.textContent = `${gachaCount} 枚`;
        }

        function addFreeGacha(amount) {
            gachaCount += amount;
            updateUI();
        }

        function drawGacha(times) {
            if (gachaCount < times) {
                alert('ガチャ券が足りません！');
                return;
            }
            gachaCount -= times;
            updateUI();

            const container = document.getElementById('result-content');
            container.innerHTML = '';
            
            const rarities = ['SSR 伝説の聖剣', 'SR 魔法の盾', 'R 鉄の剣', 'N 木の棒'];
            for(let i=0; i<times; i++) {
                const item = document.createElement('div');
                item.className = 'bg-slate-800 border border-slate-700 p-2 rounded-lg text-xs font-bold text-amber-300 w-full';
                const picked = rarities[Math.floor(Math.random() * rarities.length)];
                item.textContent = `${i+1}. ${picked}`;
                container.appendChild(item);
            }

            document.getElementById('result-modal').classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function toggleAudio() {
            const icon = document.getElementById('bgm-icon');
            if (icon.classList.contains('fa-volume-xmark')) {
                icon.className = 'fa-solid fa-volume-high';
            } else {
                icon.className = 'fa-solid fa-volume-xmark';
            }
        }
    </script>
</body>
</html>
