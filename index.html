<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勇者の世界ガチャ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome アイコン -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- キャンバス紙吹雪 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
  <!-- Three.js を使用した 3D グラフィックス -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&family=Shippori+Mincho:wght@700;800&display=swap');
    
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: radial-gradient(circle at 50% 20%, #201335 0%, #0c0817 100%);
      min-height: 100vh;
      color: #ffffff;
      user-select: none;
    }

    .font-fantasy {
      font-family: 'Shippori Mincho', serif;
    }

    /* ネオングロー効果 */
    .glow-gold {
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.5), inset 0 0 15px rgba(255, 236, 153, 0.3);
    }
    .glow-cyan {
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
    }
    .glow-gacha {
      box-shadow: 0 0 35px rgba(234, 88, 12, 0.6), inset 0 0 20px rgba(255, 180, 50, 0.3);
    }

    /* ガチャマシンアニメーション */
    @keyframes magicCircleRotate {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .magic-circle-spin {
      animation: magicCircleRotate 12s linear infinite;
    }

    @keyframes capsuleFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(5deg); }
    }
    .capsule-anim-1 { animation: capsuleFloat 3s ease-in-out infinite; }
    .capsule-anim-2 { animation: capsuleFloat 4s ease-in-out infinite 0.5s; }
    .capsule-anim-3 { animation: capsuleFloat 3.5s ease-in-out infinite 1s; }

    /* モーダル表示 */
    .modal-backdrop {
      background: rgba(8, 4, 18, 0.85);
      backdrop-filter: blur(8px);
    }

    /* ジョイスティック */
    #joystick-zone {
      touch-action: none;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen items-center p-2 sm:p-4 selection:bg-amber-500 selection:text-black">

  <!-- ==================== UI HOME SCREEN ==================== -->
  <div id="home-screen" class="w-full max-w-4xl flex flex-col gap-4">
    
    <!-- TOP HEADER BAR -->
    <header class="flex justify-between items-center px-2 py-1">
      <button onclick="openModal('quest')" class="w-10 h-10 rounded-full bg-amber-600/40 border border-amber-400/60 flex items-center justify-center text-amber-300 hover:bg-amber-500/60 transition">
        <i class="fa-solid fa-scroll text-lg"></i>
      </button>
      
      <div class="text-center">
        <h1 class="text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-200 font-fantasy tracking-wider drop-shadow-[0_2px_10px_rgba(245,158,11,0.5)] flex items-center gap-2 justify-center">
          <i class="fa-solid fa-swords text-amber-400"></i>
          勇者の世界ガチャ
          <span class="w-3 h-3 rounded-full bg-amber-400 inline-block animate-ping"></span>
        </h1>
        <p class="text-xs text-amber-300/70 tracking-widest mt-0.5">✨ 自由な配置で世界をデザインしよう！ ✨</p>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="addFreeGacha(50)" class="bg-gradient-to-r from-amber-500 to-yellow-500 text-black font-extrabold px-3 py-1.5 rounded-full text-xs shadow-lg hover:brightness-110 active:scale-95 transition flex items-center gap-1 border border-yellow-200">
          <i class="fa-solid fa-plus text-xs"></i> 招集を追加する
        </button>
        <button onclick="toggleAudio()" class="w-8 h-8 rounded-full bg-purple-900/60 border border-purple-400/40 flex items-center justify-center text-purple-20
